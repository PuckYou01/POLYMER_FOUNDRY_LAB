<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="เกมออกแบบพอลิเมอร์ตามข้อกำหนดสมบัติ สำหรับเคมี ม.6 บทที่ 13">
<title>โรงหล่อพอลิเมอร์ — POLYMER FOUNDRY LAB</title>
<style>
:root{
  --ground:#101826; --panel:#1A2434; --panel2:#212D40; --rule:#2E3B50;
  --ink:#E6EDF7; --dim:#8FA0BA;
  --molten:#F2A33C; --chain:#7BB4FF; --branch:#C48CFF; --pendant:#FFD479;
  --xlink:#FF7A59; --pass:#3FBF8F; --fail:#E8624A;
  --r:10px; --rp:14px;
  --fs:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Leelawadee UI","Prompt",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--ground); color:var(--ink); font-family:var(--fs);
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--molten);outline-offset:2px;border-radius:4px}

#app{
  display:flex; flex-direction:column; height:100dvh; max-width:820px; margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.on{display:flex}

/* ---------- แถบหัว ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule);flex:none}
.bar h1{font-size:17px;margin:0;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--r);color:var(--dim);font-size:15px}
.iconbtn:active{background:var(--panel2)}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px}

/* ---------- องค์ประกอบทั่วไป ---------- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--rp);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:16px;font-weight:600}
.muted{color:var(--dim);font-size:14px}
.tiny{color:var(--dim);font-size:12.5px}
.btn{display:block;width:100%;min-height:50px;border-radius:var(--r);background:var(--molten);
  color:#1A1206;font-weight:700;padding:12px;text-align:center}
.btn:disabled{background:var(--panel2);color:var(--dim);font-weight:500}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);font-weight:500}
.btn:active:not(:disabled){filter:brightness(.9)}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=text],input[type=number]{width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r);
  background:var(--ground);border:1px solid var(--rule);color:var(--ink);font-family:inherit;font-size:16px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:13.5px;color:var(--dim);margin-bottom:4px}

/* ---------- ใบสั่งผลิต ---------- */
.brief{background:var(--panel);border-left:3px solid var(--molten);border-radius:0 var(--rp) var(--rp) 0;
  padding:12px 14px;margin-bottom:12px}
.brief .client{font-size:12.5px;color:var(--molten);margin-bottom:2px}
.brief p{margin:6px 0 0;font-size:14.5px}
.brief b{color:var(--pendant);font-weight:600}
details.hint{margin-top:8px}
details.hint summary{color:var(--dim);font-size:13.5px;cursor:pointer;min-height:32px;display:flex;align-items:center}
details.hint p{font-size:13.5px;color:var(--dim);border-top:1px solid var(--rule);padding-top:8px}

/* ---------- ชิปมอนอเมอร์ / เรซิน ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--panel2);border-radius:var(--r);
  padding:8px 11px;min-height:46px;display:flex;flex-direction:column;justify-content:center;text-align:left}
.chip b{font-size:13.5px;font-weight:600;display:block}
.chip i{font-style:normal;font-size:11.5px;color:var(--dim)}
.chip.sel{border-color:var(--molten);background:#2A2213}
.chip.sel b{color:var(--molten)}

/* ---------- สลับชนิดปฏิกิริยา ---------- */
.seg{display:flex;background:var(--panel2);border-radius:var(--r);padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:7px;font-size:14.5px;color:var(--dim)}
.seg button.on{background:var(--molten);color:#1A1206;font-weight:700}

/* ---------- เวที SVG ---------- */
.stage{background:#0B121D;border:1px solid var(--rule);border-radius:var(--rp);overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto}
.stagemsg{position:absolute;left:0;right:0;bottom:0;background:rgba(11,18,29,.94);
  border-top:1px solid var(--rule);padding:9px 12px;font-size:13.5px}
.stagemsg.bad{color:var(--fail)} .stagemsg.good{color:var(--pass)}

/* ---------- ถังดักโมเลกุลเล็ก ---------- */
.trap{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--rule);
  border-radius:var(--rp);padding:10px 12px;margin-top:10px}
.trap .lbl{font-size:13px;color:var(--dim);flex:none}
.traptube{flex:1;height:26px;background:var(--ground);border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.trapfill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--chain);opacity:.55;transition:width .18s}
.trapnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px}
.trap button{flex:none;min-height:44px;padding:0 14px;border-radius:var(--r);background:var(--panel2);border:1px solid var(--rule);font-size:14px}
.trap.full .traptube{border-color:var(--molten)}
.trap.full button{background:var(--molten);color:#1A1206;font-weight:700}

/* ---------- สไลเดอร์ ---------- */
.sl{margin-bottom:14px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.sl .top b{font-size:14px;font-weight:600}
.sl .top span{font-size:13px;color:var(--molten)}
.sl .cap{font-size:12px;color:var(--dim);margin-top:2px}
input[type=range]{width:100%;height:44px;background:transparent;-webkit-appearance:none;appearance:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--panel2);border-radius:3px}
input[type=range]::-moz-range-track{height:6px;background:var(--panel2);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:var(--molten);border:3px solid var(--ground);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--molten);border:3px solid var(--ground)}

/* ---------- มาตรวัดสมบัติ ---------- */
.gauge{margin-bottom:11px}
.gauge .g1{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:3px}
.gauge .g1 em{font-style:normal;color:var(--dim)}
.gauge .g1 b{font-weight:700}
.gtrack{position:relative;height:12px;background:var(--panel2);border-radius:6px;overflow:hidden}
.gband{position:absolute;top:0;bottom:0;background:rgba(242,163,60,.22);border-left:2px solid var(--molten);border-right:2px solid var(--molten)}
.gfill{position:absolute;top:0;bottom:0;left:0;background:var(--dim);border-radius:6px;transition:width .35s ease}
.gauge.pass .gfill{background:var(--pass)} .gauge.fail .gfill{background:var(--fail)}
.gauge.pass .g1 b{color:var(--pass)} .gauge.fail .g1 b{color:var(--fail)}
.gauge.untested .gfill{width:0!important} .gauge.untested .g1 b{color:var(--dim)}

/* ---------- รายการตรวจข้อกำหนด ---------- */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14px}
.checks li:last-child{border-bottom:0}
.checks li .m{flex:none;width:20px;text-align:center;font-weight:700}
.checks li.y .m{color:var(--pass)} .checks li.n .m{color:var(--fail)}
.checks li.n{color:var(--dim)}

/* ---------- รายการภารกิจ ---------- */
.mission{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--rule);border-radius:var(--rp);padding:13px;margin-bottom:10px;min-height:64px}
.mission .st{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim)}
.mission.done .st{background:var(--pass);border-color:var(--pass);color:#0C1A14;font-weight:700}
.mission .tx{flex:1;min-width:0}
.mission .tx b{display:block;font-size:15px;font-weight:600}
.mission .tx i{font-style:normal;font-size:12.5px;color:var(--dim)}

/* ---------- แถบสถานะการส่งข้อมูล ---------- */
#sync{font-size:11.5px;color:var(--dim);padding:6px 14px;border-top:1px solid var(--rule);
  display:flex;justify-content:space-between;flex:none}
#sync .warn{color:var(--molten)}

/* ---------- บันทึกวิศวกร ---------- */
.codex h3{font-size:14px;margin:16px 0 6px;color:var(--molten);font-weight:600}
.codex ul{margin:0;padding-left:20px;font-size:14.5px}
.codex ul li{margin-bottom:6px}
.mythrow{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.mythrow div{padding:9px 11px;font-size:13.5px}
.mythrow .bad{background:#2A1A18;color:#F0B9AE}
.mythrow .good{background:#132A22;color:#A8E6CD;border-top:1px solid var(--rule)}
.cliff{border:1px dashed var(--molten);border-radius:var(--r);padding:11px;font-size:14px;color:var(--pendant)}
#codexImg{width:100%;border-radius:var(--rp);border:1px solid var(--rule);margin-top:10px;display:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));
  background:var(--panel2);border:1px solid var(--rule);border-radius:999px;padding:10px 18px;font-size:14px;
  z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:760px) and (orientation:landscape){
  .split{display:flex;gap:14px;align-items:flex-start}
  .split>.left{flex:1.15;min-width:0} .split>.right{flex:1;min-width:0}
}

/* ============================================================
   v1.1 — หน้าหลักแบบใหม่ และหมวดที่เพิ่มเข้ามา
   ============================================================ */
:root{
  --ta:#F2A33C;  /* ปฏิกรณ์ */
  --tb:#7BB4FF;  /* สถาปนิกสายโซ่ */
  --tc:#C48CFF;  /* โต๊ะปรับแต่ง */
  --td:#5EE0D6;  /* โรงแยกสลาย */
  --te:#8ED07A;  /* แยกขยะ */
  --tf:#FFD479;  /* เกร็ดความรู้ */
  --tg:#FF9AA8;  /* แบบทดสอบ */
  --th:#9FB2CC;  /* บันทึกวิศวกร */
}

/* ---------- ส่วนหัวสรุปความคืบหน้า ---------- */
.hero{background:linear-gradient(150deg,#1B2739 0%,#141D2C 100%);
  border:1px solid var(--rule);border-radius:16px;padding:16px 16px 14px;margin-bottom:20px}
.heroline{display:flex;align-items:center;justify-content:space-between;gap:14px}
.eyebrow{font-size:12.5px;color:var(--dim)}
.bignum{font-size:34px;font-weight:700;line-height:1.15;margin-top:2px}
.bignum span{font-size:15px;font-weight:400;color:var(--dim);margin-left:5px}
.hbar{height:6px;background:var(--ground);border-radius:3px;overflow:hidden;margin-top:12px}
.hbar span{display:block;height:100%;background:var(--molten);border-radius:3px;transition:width .5s ease}

.ring{width:52px;height:52px;flex:none;color:var(--molten)}
.ring.ta{color:var(--ta)} .ring.tb{color:var(--tb)} .ring.tc{color:var(--tc)} .ring.td{color:var(--td)}

.sechead{font-size:13px;color:var(--dim);font-weight:500;margin:0 0 9px 2px}

/* ---------- แผ่นเมนู ---------- */
.tiles{display:grid;gap:10px;margin-bottom:20px}
.tile{display:flex;align-items:center;gap:13px;text-align:left;width:100%;min-height:76px;
  background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:13px;
  position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:currentColor;opacity:.85}
.tile.ta{color:var(--ta)} .tile.tb{color:var(--tb)} .tile.tc{color:var(--tc)} .tile.td{color:var(--td)}
.tile.te{color:var(--te)} .tile.tf{color:var(--tf)} .tile.tg{color:var(--tg)} .tile.th{color:var(--th)}
.tile:active{background:var(--panel2)}
.tile .tt{flex:1;min-width:0;color:var(--ink)}
.tile .tt b{display:block;font-size:15.5px;font-weight:600;margin-bottom:1px}
.tile .tt i{display:block;font-style:normal;font-size:12.5px;color:var(--dim);line-height:1.4}
.tile .tt u{display:block;text-decoration:none;font-size:12px;color:currentColor;margin-top:4px}
.tile .ic{flex:none;width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border:1px solid var(--rule);font-size:16px;font-weight:700;color:currentColor}
.tile.done{border-color:currentColor}
@media (min-width:620px){.tiles{grid-template-columns:1fr 1fr}}

/* ---------- สวิตช์ ---------- */
label.toggle{display:flex;align-items:center;gap:12px;min-height:52px;cursor:pointer;
  border-top:1px solid var(--rule);padding-top:12px;margin-top:4px}
label.toggle input{position:absolute;opacity:0;width:0;height:0}
label.toggle span{flex:none;width:48px;height:28px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--rule);position:relative;transition:background .18s}
label.toggle span::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--dim);transition:transform .18s,background .18s}
label.toggle input:checked+span{background:#3A2E17;border-color:var(--molten)}
label.toggle input:checked+span::after{transform:translateX(20px);background:var(--molten)}
label.toggle input:focus-visible+span{outline:2px solid var(--molten);outline-offset:2px}
label.toggle div b{display:block;font-size:14px;font-weight:600}
label.toggle div i{font-style:normal;font-size:12px;color:var(--dim)}

.chip.wide{width:100%}
h3.sub{font-size:13px;color:var(--dim);font-weight:500;margin:14px 0 8px}

/* ---------- โรงแยกสลาย ---------- */
.wasteid{display:flex;align-items:center;gap:13px}
.wasteid b{display:block;font-size:15.5px}
.wasteid i{font-style:normal;font-size:12.5px;color:var(--dim);word-break:break-all}
.rcode{flex:none;width:46px;height:46px;border-radius:12px;border:2px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--molten)}
.yieldbar{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-top:10px}
.yieldbar span{display:block;height:100%;background:var(--molten);border-radius:5px;transition:width .4s}
.verdict{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:14px}
.verdict.y{background:#132A22;color:#A8E6CD;border:1px solid #245244}
.verdict.n{background:#2A1A18;color:#F0B9AE;border:1px solid #5A302A}

/* ---------- มินิเกมแยกขยะ ---------- */
.hud{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.hud b{color:var(--ink);font-weight:700}
.timetrack{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.timetrack span{display:block;height:100%;background:var(--te);transition:width 1s linear}
.card.item{text-align:center;padding:20px 14px}
.card.item .clue{font-size:14px;color:var(--pendant);margin:8px 0 0}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bin{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:76px;justify-content:center;
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:8px 4px}
.bin b{font-size:11.5px;color:var(--dim);font-weight:600}
.bin .rcode{width:34px;height:34px;font-size:15px;border-width:1.5px;color:var(--ink)}
.bin:active{background:var(--panel2)}
.bin.right{border-color:var(--pass)} .bin.right .rcode{color:var(--pass);border-color:var(--pass)}
.bin.wrong{border-color:var(--fail)} .bin.wrong .rcode{color:var(--fail);border-color:var(--fail)}
.bin:disabled{opacity:.55} .bin.right:disabled,.bin.wrong:disabled{opacity:1}
.bigscore{font-size:46px;font-weight:700;color:var(--molten);line-height:1.1;margin:6px 0 4px}
.codetable .coderow{display:flex;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.codetable .coderow:last-child{border-bottom:0}
.codetable .coderow .rcode{width:36px;height:36px;font-size:15px;border-width:1.5px}
.codetable b{font-size:13.5px}
.codetable i{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:1px}
.codetable div{font-size:13.5px}

/* ---------- แบบทดสอบ ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.qhead .tag{color:var(--tg)}
.qbar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-bottom:14px}
.qbar span{display:block;height:100%;background:var(--tg);transition:width .3s}
.qtext{font-size:16px;line-height:1.6;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;min-height:52px;
  background:var(--ground);border:1px solid var(--rule);border-radius:11px;padding:11px 12px;font-size:14.5px;line-height:1.5}
.opt .ol{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim)}
.opt.sel{border-color:var(--tg);background:#2A1A20}
.opt.sel .ol{background:var(--tg);border-color:var(--tg);color:#1A0E12;font-weight:700}
textarea{width:100%;background:var(--ground);border:1px solid var(--rule);border-radius:11px;
  color:var(--ink);font-family:inherit;font-size:15.5px;line-height:1.6;padding:12px;resize:vertical}
ol.review{margin:0;padding-left:20px;font-size:14px}
ol.review li{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
ol.review li:last-child{border-bottom:0}
ol.review li::marker{color:var(--dim)}
ol.review li.y::marker{color:var(--pass)} ol.review li.n::marker{color:var(--fail)}
.rq{margin:0 0 6px;font-size:14px}
.ra{margin:0 0 5px;font-size:13.5px;color:var(--pass)}
.ra .mine{color:var(--fail)}
.rw{margin:0;font-size:13px;color:var(--dim)}
.selfcheck{border:1px solid var(--rule);border-radius:11px;padding:12px;margin-bottom:10px}
.mybox{background:var(--ground);border-radius:9px;padding:10px 11px;font-size:14px;
  white-space:pre-wrap;margin-top:6px;border-left:3px solid var(--tg)}
ul.keys{margin:0;padding-left:19px;font-size:13.5px;color:var(--pendant)}
ul.keys li{margin-bottom:4px}

/* ---------- เกร็ดความรู้ ---------- */
.factcard{background:var(--panel);border:1px solid var(--rule);border-radius:12px;margin-bottom:9px;overflow:hidden}
.factcard summary{padding:14px;font-size:15px;font-weight:600;cursor:pointer;min-height:52px;
  display:flex;align-items:center;gap:9px;list-style:none}
.factcard summary::-webkit-details-marker{display:none}
.factcard summary::before{content:'+';flex:none;width:22px;height:22px;border-radius:50%;
  background:var(--panel2);color:var(--tf);display:flex;align-items:center;justify-content:center;font-size:15px}
.factcard[open] summary::before{content:'−'}
.factcard[data-read] summary{color:var(--dim)}
.factcard p{margin:0;padding:0 14px 15px;font-size:14.5px;line-height:1.65;color:var(--ink)}
.mission.fact .st{border-color:var(--tf);color:var(--tf)}
.mission.fact.done .st{background:var(--tf);border-color:var(--tf);color:#1A1206}
.loginart{width:100%;max-width:320px;height:auto;display:block;margin:0 auto 10px}

/* ============================================================
   v1.2 — ภาพประกอบ สถานีปรับแต่ง และการนำทางแบบทดสอบ
   ============================================================ */
.banner{background:linear-gradient(160deg,#182233 0%,#121A28 100%);
  border:1px solid var(--rule);border-radius:14px;padding:6px 10px;margin-bottom:14px;overflow:hidden}
.banner svg.bnr{display:block;width:100%;height:auto;max-height:104px}
.banner.ta{border-color:rgba(242,163,60,.35)} .banner.tb{border-color:rgba(123,180,255,.35)}
.banner.tc{border-color:rgba(196,140,255,.35)} .banner.td{border-color:rgba(94,224,214,.35)}
.banner.te{border-color:rgba(142,208,122,.35)} .banner.tf{border-color:rgba(255,212,121,.35)}
.banner.tg{border-color:rgba(255,154,168,.35)} .banner.th{border-color:rgba(159,178,204,.35)}

.objart{width:56px;height:56px;flex:none;display:block}
.objart.big{width:96px;height:96px;margin:0 auto}
svg.tri{width:38px;height:38px;flex:none;display:block}
svg.factart{width:44px;height:44px;flex:none;display:block}
svg.glyph{width:40px;height:26px;flex:none;display:block;margin-bottom:2px}

.chip.mono{flex-direction:row;align-items:center;gap:9px}
.chip.mono>span{min-width:0}

.wasteid{display:flex;align-items:center;gap:14px;text-align:left}
.wasteid>div{flex:1;min-width:0}
.card.item .objart.big{margin-bottom:8px}

.mission.fact{gap:12px}
.brief.facthead{display:flex;align-items:center;gap:13px}

.bin{gap:3px}
.bin svg.tri{width:32px;height:32px}
.bin.right svg.tri path{stroke:var(--pass)!important} .bin.right svg.tri text{fill:var(--pass)!important}
.bin.wrong svg.tri path{stroke:var(--fail)!important} .bin.wrong svg.tri text{fill:var(--fail)!important}
.codetable .coderow{gap:12px}

/* ---------- สถานีปรับแต่ง ---------- */
.stations{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stations button{display:flex;align-items:center;gap:8px;min-height:48px;padding:9px 11px;
  background:var(--ground);border:1px solid var(--rule);border-radius:10px;font-size:13.5px;color:var(--dim);text-align:left}
.stations button .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--rule)}
.stations button.used .dot{background:var(--tc)}
.stations button.on{background:var(--panel2);border-color:var(--tc);color:var(--ink);font-weight:600}
.cure{display:flex;align-items:center;gap:12px;border:1px dashed var(--rule);border-radius:11px;padding:12px;margin-top:4px}
.cure>div{flex:1;min-width:0}
.cure b{font-size:13.5px;font-weight:600;color:var(--dim)}
.cure .btn{width:auto;min-width:132px;min-height:44px;flex:none;font-size:14px}
.cure.done{border-style:solid;border-color:var(--xlink,#FF7A59)}
.cure.done b{color:var(--xl,#FF7A59)}
.pattern{font-family:ui-monospace,monospace;font-size:13px;color:var(--tc);margin:9px 0 2px;letter-spacing:.04em}
.conjnote{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.conjnote.ok{background:#132A22;color:#A8E6CD} .conjnote.no{background:#2A1A18;color:#F0B9AE}

/* ---------- การนำทางในแบบทดสอบ ---------- */
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.qnav button{width:36px;height:36px;border-radius:9px;background:var(--ground);
  border:1px solid var(--rule);color:var(--dim);font-size:13.5px}
.qnav button.wr{border-style:dashed}
.qnav button.ok{background:var(--panel2);color:var(--ink);border-color:var(--tg)}
.qnav button.cur{outline:2px solid var(--tg);outline-offset:1px;color:var(--ink)}
.navnote{margin:0 0 12px}
.qfoot{display:flex;gap:10px;margin:12px 0 8px}
.qfoot .btn{flex:1}
.linkbtn{display:block;margin-top:10px;color:var(--dim);font-size:13px;text-decoration:underline;min-height:36px}
.warnbox{border:1px solid rgba(255,154,168,.4);background:#2A1A20;color:#F5C3CB;
  border-radius:11px;padding:11px 13px;font-size:13.5px;margin-bottom:12px}

/* ---------- กล่องยืนยันในตัวเกม ---------- */
.modal{position:fixed;inset:0;background:rgba(7,11,18,.72);z-index:80;
  display:none;align-items:center;justify-content:center;padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
  padding:20px;max-width:400px;width:100%}
.mbox h2{margin:0 0 6px;font-size:17px;font-weight:600}
.mbox p{margin:0 0 16px;font-size:14.5px;color:var(--dim);line-height:1.6}
.mrow{display:flex;gap:10px}
.mrow .btn{flex:1;min-height:48px}
.btn.danger{background:var(--fail);color:#2A0D08}

/* ---------- ภาพประจำเรื่องในเกร็ดความรู้ ---------- */
.factbody{padding:0 14px 15px}
.factbody svg.cardart{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 10px;
  background:#0E1725;border:1px solid var(--rule);border-radius:11px;padding:6px}
.factbody p{margin:0;padding:0;font-size:14.5px;line-height:1.65}
.factcard p{margin:0;padding:0 14px 15px;font-size:14.5px;line-height:1.65;color:var(--ink)}
.banner svg.bnr{max-height:112px}

/* ---------- รูปถ่ายจริงในเกร็ดความรู้ ---------- */
figure.photo{margin:0 0 10px}
figure.photo img{display:block;width:100%;height:auto;max-height:220px;object-fit:cover;
  border-radius:11px;border:1px solid var(--rule);background:#0E1725}
figure.photo figcaption{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.45}

/* ============================================================
   v1.4 — ปรับสำหรับการใช้งานบนมือถือ
   ============================================================ */

/* ---------- แถบปฏิบัติการติดขอบล่าง เอื้อมนิ้วถึงตลอด ---------- */
.actionbar{flex:none;display:flex;gap:10px;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);background:rgba(16,24,38,.96);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.actionbar:empty{display:none}
.actionbar .btn{flex:1;min-height:52px;margin:0}
.actionbar .btn.ghost{flex:.9}

/* ---------- ป้ายภาษาอังกฤษกำกับ ---------- */
.sl .top b em,.toggle div b em,label.f span em{font-style:normal;font-weight:400;
  font-size:11.5px;color:var(--dim);margin-left:6px;letter-spacing:.01em}
.chip b em{font-style:normal;font-weight:400;font-size:11px;color:var(--dim)}
.seg button em{display:block;font-style:normal;font-size:10.5px;opacity:.75;margin-top:1px;letter-spacing:.01em}
.stations button .lb{min-width:0}
.stations button .lb b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}
.stations button .lb i{display:block;font-style:normal;font-size:10.5px;opacity:.8;letter-spacing:.01em}
.stations button.on .lb i{opacity:.9}

/* ---------- กล่องจำลองเตี้ยลง ---------- */
.stage svg{max-height:230px}

/* ---------- จอแคบ: บีบระยะและขนาดให้เห็นเนื้อหามากขึ้น ---------- */
@media (max-width:460px){
  .scroll{padding:12px}
  .card{padding:12px;margin-bottom:10px;border-radius:12px}
  .banner{padding:4px 8px;margin-bottom:11px}
  .banner svg.bnr{max-height:72px}
  .brief{padding:10px 12px}
  .brief p{font-size:14px}
  .hero{padding:13px 13px 11px;margin-bottom:16px}
  .bignum{font-size:29px}
  .ring{width:46px;height:46px}
  .tile{min-height:70px;padding:11px;gap:11px}
  .tile .ic{width:46px;height:46px;border-radius:11px}
  .tile .tt b{font-size:14.5px}
  .tile .tt i{font-size:12px}
  .stage svg{max-height:168px}
  .sl{margin-bottom:11px}
  .gauge{margin-bottom:9px}
  .objart.big{width:82px;height:82px}
  .stations{gap:6px}
  .stations button{padding:8px 9px;min-height:46px}
  .bins{grid-template-columns:repeat(4,1fr);gap:6px}
  .bin{min-height:68px}
  .bin svg.tri{width:28px;height:28px}
  .bin b{font-size:10.5px}
  .qnav button{width:32px;height:32px;border-radius:8px;font-size:12.5px}
  .opt{font-size:14px;padding:10px 11px}
  figure.photo img{max-height:170px}
  .factbody svg.cardart{max-width:100%}
  .mbox{padding:16px;border-radius:14px}
}

/* ---------- จอแคบมาก ---------- */
@media (max-width:360px){
  .bar h1{font-size:15.5px}
  .tile .tt i{display:none}
  .actionbar{padding-left:11px;padding-right:11px}
  .stations{grid-template-columns:1fr}
}

/* ---------- แนวนอนเตี้ย เช่น มือถือหมุนข้าง ---------- */
@media (orientation:landscape) and (max-height:520px){
  .banner{display:none}
  .stage svg{max-height:132px}
}

</style>

<script>

/* ===== 10_data.js ===== */
/* ============================================================
   10_data.js — คลังมอนอเมอร์ ใบสั่งผลิต และเนื้อหาบันทึกวิศวกร
   อ้างอิง: สสวท. เคมี เล่ม 5 บทที่ 13 (13.1-13.3)
   ============================================================ */
(function (root) {
  'use strict';

  /* ---------- คลังมอนอเมอร์ ----------
     groups : หมู่ว่องไวที่ใช้ในปฏิกิริยา
     func   : จำนวนหมู่ว่องไว (นับ C=C เป็น 2 เพราะต่อได้สองด้าน)
     imf    : แรงยึดเหนี่ยวที่พอลิเมอร์จะได้  1=ลอนดอน 2=ขั้ว 3=พันธะไฮโดรเจน
     bulk   : ขนาดหมู่ข้างเคียง 0=H 1=CH3 2=Cl/CN 3=วงเบนซีน/เอสเทอร์ใหญ่     */
  var MONOMERS = [
    { id:'ethene',  name:'อีทีน',            formula:'CH₂=CH₂',          groups:['C=C'], func:2, imf:1, bulk:0, cost:10, conj:false,
      note:'มอนอเมอร์ของพอลิเอทิลีน' },
    { id:'propene', name:'โพรพีน',           formula:'CH₂=CHCH₃',        groups:['C=C'], func:2, imf:1, bulk:1, cost:12, conj:false,
      note:'มีหมู่เมทิลเป็นหมู่ข้างเคียง' },
    { id:'styrene', name:'สไตรีน',           formula:'CH₂=CHC₆H₅',       groups:['C=C'], func:2, imf:1, bulk:3, cost:20, conj:false,
      note:'วงเบนซีนเป็นหมู่ข้างเคียง ไม่ใช่กิ่ง' },
    { id:'vcm',     name:'ไวนิลคลอไรด์',      formula:'CH₂=CHCl',         groups:['C=C'], func:2, imf:2, bulk:2, cost:16, conj:false,
      note:'พันธะ C–Cl มีขั้ว' },
    { id:'acryl',   name:'อะคริโลไนไตรล์',    formula:'CH₂=CHCN',         groups:['C=C'], func:2, imf:2, bulk:2, cost:22, conj:false,
      note:'หมู่ไนไตรล์มีขั้วสูง' },
    { id:'acetylene', name:'อะเซทิลีน',      formula:'HC≡CH',            groups:['C=C'], func:2, imf:1, bulk:0, cost:26, conj:true,
      note:'ได้สายที่มีพันธะคู่สลับพันธะเดี่ยว' },
    { id:'ethgly',  name:'เอทิลีนไกลคอล',     formula:'HOCH₂CH₂OH',       groups:['OH'],  func:2, imf:3, bulk:0, cost:14, conj:false,
      note:'มีหมู่ –OH สองหมู่' },
    { id:'tpa',     name:'กรดเทเรฟทาลิก',     formula:'HOOC–C₆H₄–COOH',   groups:['COOH'],func:2, imf:2, bulk:3, cost:24, conj:false,
      note:'มีหมู่ –COOH สองหมู่ คั่นด้วยวงเบนซีน' },
    { id:'adipic',  name:'กรดเฮกซะเนไดโออิก', formula:'HOOC(CH₂)₄COOH',   groups:['COOH'],func:2, imf:2, bulk:0, cost:20, conj:false,
      note:'กรดไดคาร์บอกซิลิก 6 คาร์บอน' },
    { id:'hmda',    name:'เฮกเซน-1,6-ไดเอมีน',formula:'H₂N(CH₂)₆NH₂',     groups:['NH2'], func:2, imf:3, bulk:0, cost:23, conj:false,
      note:'มีหมู่ –NH₂ สองหมู่' },
    { id:'lactic',  name:'กรดแลกติก',        formula:'CH₃CH(OH)COOH',    groups:['COOH','OH'], func:2, imf:2, bulk:1, cost:18, conj:false,
      note:'มีทั้ง –OH และ –COOH ในโมเลกุลเดียว' },
    { id:'glycine', name:'ไกลซีน',           formula:'H₂NCH₂COOH',       groups:['COOH','NH2'], func:2, imf:3, bulk:0, cost:21, conj:false,
      note:'กรดแอมิโน มีทั้ง –NH₂ และ –COOH' },
    { id:'sebacoyl',name:'เซบาคอยล์คลอไรด์',  formula:'ClOC(CH₂)₈COCl',   groups:['COCl'],func:2, imf:2, bulk:0, cost:28, conj:false,

      why:'พอลิเมอร์ย่อยสลายได้หลายชนิดต้องการภาวะเฉพาะ การทิ้งรวมทำให้ข้อดีหายไป' },
    { id:'q19', level:'An', topic:'13.5', q:'เหตุใดจึงต้องคัดแยกพลาสติกตามรหัสก่อนนำไปรีไซเคิล',
      c:['เพื่อความสวยงามของโรงงาน','เพราะพลาสติกต่างชนิดมีจุดหลอมเหลวและความเข้ากันได้ต่างกัน หลอมรวมแล้วจะแยกเฟสและเปราะ','เพราะกฎหมายบังคับเท่านั้น','เพราะพลาสติกทุกชนิดมีพันธะเอสเทอร์'], a:1,
      why:'ความไม่เข้ากันของพอลิเมอร์ต่างชนิดทำให้วัสดุที่ได้ไม่แข็งแรง' },
    { id:'q20', level:'An', topic:'13.1', q:'ขนมสายไหมทำจากซูโครส ส่วนสำลีเป็นพอลิแซ็กคาไรด์ ข้อใดเปรียบเทียบได้ถูกต้อง',
      c:['สายไหมทนแรงดึงมากกว่าเพราะละลายน้ำได้','สำลีทนแรงดึงมากกว่าเพราะเป็นพอลิเมอร์ที่มีแรงยึดเหนี่ยวระหว่างโมเลกุลมากกว่า','ทั้งสองมีสมบัติเหมือนกันเพราะทำจากน้ำตาล','สายไหมเป็นพอลิเมอร์ ส่วนสำลีเป็นมอนอเมอร์'], a:1,
      why:'โมเลกุลขนาดใหญ่มีพื้นที่สัมผัสมากกว่า แรงยึดเหนี่ยวรวมจึงมากกว่า' },
    { id:'q21', level:'An', topic:'13.1', q:'ข้อใดเป็นตัวอย่างที่หักล้างความเข้าใจว่า “พอลิเมอร์คือพลาสติกเท่านั้น” ได้ดีที่สุด',
      c:['ขวด PET','ยางธรรมชาติ เซลลูโลส และโปรตีน','ถุง HDPE','กล่องโฟม'], a:1,
      why:'ยาง กาว เจล เซลลูโลส และโปรตีน ล้วนเป็นพอลิเมอร์ที่ไม่ใช่พลาสติก' },
    { id:'q22', level:'An', topic:'13.2', q:'ไนลอน 6,6 ใช้มอนอเมอร์สองชนิด ข้อสรุปใดถูกต้อง',
      c:['พอลิเมอร์ทุกชนิดต้องใช้มอนอเมอร์สองชนิด','พอลิเมอร์อาจเกิดจากมอนอเมอร์ชนิดเดียวหรือหลายชนิดก็ได้','ไนลอนเกิดจากปฏิกิริยาแบบเติม','ไนลอนไม่มีพันธะไฮโดรเจน'], a:1,
      why:'พอลิเอทิลีนใช้มอนอเมอร์ชนิดเดียว ส่วนไนลอน 6,6 ใช้สองชนิด ทั้งคู่เป็นพอลิเมอร์' },
    { id:'q23', level:'Ev', topic:'13.3', q:'ต้องเลือกวัสดุทำเส้นใยที่ต้องทนแรงดึงสูงมาก ข้อใดเป็นเกณฑ์ที่สำคัญที่สุด',
      c:['มีหมู่ข้างเคียงใหญ่ที่สุด','มีแรงยึดเหนี่ยวระหว่างสายโซ่สูงและสายโซ่ยาว','มีการเชื่อมขวางมากที่สุด','มีกิ่งมากที่สุด'], a:1,
      why:'แรงยึดเหนี่ยวระหว่างสายและความยาวสายเป็นตัวกำหนดความทนแรงดึงของเส้นใย' },
    { id:'q24', level:'An', topic:'13.3', q:'ไฮโดรเจลบวมน้ำได้มากแต่ไม่ละลายน้ำ เพราะเหตุใด',
      c:['มีหมู่ชอบน้ำแต่ไม่มีการเชื่อมขวาง','มีทั้งหมู่ชอบน้ำและการเชื่อมขวางที่ยึดสายโซ่ไว้ไม่ให้แยกจากกัน','ไม่มีหมู่ชอบน้ำเลย','มีมวลโมเลกุลต่ำมาก'], a:1,
      why:'หมู่ชอบน้ำดึงน้ำเข้ามา ส่วนสะพานเชื่อมขวางกันไม่ให้สายโซ่กระจายตัวออกไปในน้ำ' },
    { id:'q25', level:'Ev', topic:'13.3', q:'บริษัทอ้างว่าเพิ่มมวลโมเลกุลของพลาสติกให้สูงขึ้นเรื่อย ๆ จะได้สมบัติดีขึ้นเรื่อย ๆ ข้อวิจารณ์ใดสมเหตุสมผลที่สุด',
      c:['ถูกต้องทุกประการ','มวลโมเลกุลที่สูงขึ้นช่วยความแข็งแรง แต่ทำให้หลอมและขึ้นรูปยากขึ้น จึงมีขีดจำกัดในทางปฏิบัติ','มวลโมเลกุลไม่มีผลต่อสมบัติเลย','มวลโมเลกุลสูงทำให้กลายเป็นเทอร์มอเซต'], a:1,
      why:'สมบัติเชิงกลดีขึ้นแต่ความหนืดตอนหลอมสูงขึ้นมาก จนกระบวนการผลิตทำได้ยาก' },
    { id:'q26', level:'An', topic:'13.3', q:'ผลิตภัณฑ์สองชิ้นทำจากพอลิเอทิลีนเหมือนกัน ชิ้น ก ทนแรงดึงได้ดีกว่าชิ้น ข อย่างชัดเจน ข้อใดน่าจะเป็นความต่าง',
      c:['ชิ้น ก มีหมู่ฟังก์ชันต่างกัน','ชิ้น ก มีกิ่งน้อยกว่า สายโซ่จึงเรียงตัวชิดกว่า','ชิ้น ก เป็นเทอร์มอเซต','ชิ้น ข ผ่านวัลคาไนเซชัน'], a:1,
      why:'เมื่อเป็นพอลิเมอร์ชนิดเดียวกัน ความต่างของสมบัติมาจากโครงสร้างและมวลโมเลกุล' },
    { id:'q27', level:'Ev', topic:'13.5', q:'เมืองหนึ่งจะลดขยะพอลิเมอร์ ควรจัดลำดับความสำคัญอย่างไรจึงเหมาะสมที่สุด',
      c:['เผาให้หมดก่อน แล้วค่อยคิดเรื่องอื่น','ลดการใช้เป็นอันดับแรก แล้วจึงใช้ซ้ำ รีไซเคิล และเลือกพอลิเมอร์ย่อยสลายได้ตามความเหมาะสม','ใช้พลาสติกย่อยสลายได้ทั้งหมดเพียงอย่างเดียว','ฝังกลบทั้งหมดเพราะประหยัดที่สุด'], a:1,
      why:'การลดการใช้ตัดปัญหาที่ต้นทาง ส่วนวิธีอื่นเป็นการจัดการปลายทางที่มีข้อจำกัดของตัวเอง' },
    { id:'q28', level:'An', topic:'13.5', q:'เสื้อผ้าฝ้ายผสมโพลีเอสเตอร์รีไซเคิลยาก เพราะเหตุใด',
      c:['สีย้อมทำให้แยกไม่ได้','มีทั้งพันธะไกลโคไซด์และพันธะเอสเทอร์ในผืนเดียวกัน วิธีแยกสลายที่ใช้กับอย่างหนึ่งใช้กับอีกอย่างไม่ได้','ผ้าฝ้ายไม่ใช่พอลิเมอร์','โพลีเอสเตอร์ไม่มีพันธะที่ไฮโดรไลซ์ได้'], a:1,
      why:'องค์ประกอบสองชนิดต้องใช้กระบวนการต่างกัน จึงต้องแยกเส้นใยก่อน' },
    { id:'q29', level:'An', topic:'13.4', q:'สารเติมแต่งชนิดหนึ่งเข้าไปทำปฏิกิริยาเคมีกับพอลิเมอร์ ไม่ได้เพียงผสมอยู่ในเนื้อ ตัวอย่างที่ตรงที่สุดคือข้อใด',
      c:['พลาสติไซเซอร์','กำมะถันในวัลคาไนเซชัน','ผงสี','ผงเขม่าดำ'], a:1,
      why:'กำมะถันสร้างพันธะโคเวเลนต์เชื่อมระหว่างสายโซ่ ส่วนพลาสติไซเซอร์เพียงแทรกอยู่ระหว่างสาย' },
    { id:'q30', level:'Ev', topic:'13.3', q:'จะทดสอบว่าผลิตภัณฑ์ชิ้นหนึ่งเป็นเทอร์มอพลาสติกหรือเทอร์มอเซต วิธีใดตรงประเด็นที่สุด',
      c:['ชั่งมวลก่อนและหลังแช่น้ำ','ให้ความร้อนแล้วสังเกตว่าอ่อนตัวหรือหลอมเหลวหรือไม่','วัดความหนาแน่นด้วยการลอยน้ำ','ดูว่าโปร่งใสหรือไม่'], a:1,
      why:'เกณฑ์แบ่งกลุ่มคือการเปลี่ยนแปลงเมื่อได้รับความร้อน' },
    { id:'q31', level:'An', topic:'13.3', q:'ฟิล์มยืดห่ออาหารเป็น LDPE ส่วนถุงหูหิ้วเป็น HDPE เหตุผลที่เหมาะสมที่สุดคือข้อใด',
      c:['ถุงหูหิ้วต้องทนแรงดึงดี จึงใช้แบบเส้นที่แรงยึดเหนี่ยวระหว่างสายสูงกว่า','ฟิล์มต้องทนความร้อนสูงกว่า','LDPE มีมวลโมเลกุลสูงกว่า HDPE','HDPE เป็นเทอร์มอเซต'], a:0,
      why:'HDPE เป็นพอลิเมอร์แบบเส้น ส่วน LDPE เป็นแบบกิ่งที่นิ่มและยืดได้มากกว่า' },
    { id:'q32', level:'Ev', topic:'13.2', q:'จะออกแบบพอลิเมอร์ที่ต้องไม่มีของเสียเป็นน้ำเสียจากกระบวนการผลิตเลย ควรเลือกแนวทางใด',
      c:['ใช้ปฏิกิริยาแบบควบแน่นระหว่างกรดกับแอลกอฮอล์','ใช้ปฏิกิริยาแบบเติมจากมอนอเมอร์ที่มีพันธะคู่','ใช้ปฏิกิริยาแบบควบแน่นระหว่างกรดกับเอมีน','ใช้มอนอเมอร์ที่มีหมู่ว่องไวเพียงหมู่เดียว'], a:1,
      why:'ปฏิกิริยาแบบเติมไม่มีโมเลกุลเล็กหลุดออกมา' },
    { id:'q33', level:'An', topic:'13.2', q:'มอนอเมอร์ชนิดหนึ่งควบแน่นกับตัวเองได้โดยไม่ต้องมีมอนอเมอร์อื่น ลักษณะสำคัญของมอนอเมอร์นี้คือข้อใด',
      c:['มีพันธะคู่สองตำแหน่ง','มีหมู่ฟังก์ชันที่เข้าคู่กันได้ทั้งสองหมู่อยู่ในโมเลกุลเดียว','มีมวลโมเลกุลสูง','มีวงเบนซีนในโมเลกุล'], a:1,
      why:'เช่น กรดแลกติกที่มีทั้ง –OH และ –COOH หรือกรดแอมิโนที่มีทั้ง –NH₂ และ –COOH' },
    { id:'q34', level:'Ev', topic:'13.4', q:'ผู้ผลิตต้องการวัสดุที่มีสมบัติอยู่ระหว่างพอลิเมอร์แข็งกับพอลิเมอร์นิ่ม โดยไม่อยากเปลี่ยนไปใช้พอลิเมอร์ชนิดใหม่ทั้งหมด วิธีใดเหมาะสมที่สุด',
      c:['เพิ่มมวลโมเลกุล','สร้างโคพอลิเมอร์จากมอนอเมอร์ทั้งสองชนิดในสายเดียวกัน','เติมกำมะถันจนเป็นเอโบไนต์','เพิ่มความถี่ของกิ่งจนสูงสุด'], a:1,
      why:'โคพอลิเมอร์ให้สมบัติอยู่ระหว่างพอลิเมอร์ทั้งสอง และปรับได้ด้วยสัดส่วนกับการเรียงลำดับ' },
    { id:'q35', level:'An', topic:'13.5', q:'ยางรถยนต์ที่ผ่านวัลคาไนเซชันแล้วนำมาหลอมขึ้นรูปใหม่ไม่ได้ เพราะเหตุใด',
      c:['มีเขม่าดำผสมอยู่','มีสะพานกำมะถันเชื่อมระหว่างสายโซ่เป็นโครงสร้างแบบร่างแห','มวลโมเลกุลต่ำเกินไป','ยางเป็นพอลิเมอร์ธรรมชาติ'], a:1,
      why:'พันธะโคเวเลนต์ระหว่างสายโซ่ทำให้สายโซ่เลื่อนไถลผ่านกันไม่ได้ จึงไม่หลอม' },
    { id:'q36', level:'Ev', topic:'13.3', q:'ผู้ผลิตกล่องอาหารอ้างว่าใช้พลาสติกที่ “ทนความร้อนที่สุด” เพราะมีหมู่ข้างเคียงใหญ่ที่สุด ข้อวิจารณ์ใดเหมาะสมที่สุด',
      c:['ถูกต้อง เพราะหมู่ข้างเคียงใหญ่ทำให้แข็งแรงเสมอ','ไม่จำเป็น เพราะหมู่ข้างเคียงใหญ่ขัดขวางการจัดเรียงตัวของสายโซ่ ทำให้แรงยึดเหนี่ยวรวมลดลงได้','ถูกต้อง เพราะหมู่ข้างเคียงใหญ่ทำให้เกิดการเชื่อมขวาง','ไม่ถูก เพราะหมู่ข้างเคียงไม่มีผลต่อสมบัติเลย'], a:1,
      why:'ความทนความร้อนขึ้นกับหลายปัจจัยร่วมกัน ไม่ใช่ขนาดของหมู่ข้างเคียงเพียงอย่างเดียว' },
    { id:'q37', level:'An', topic:'13.1', q:'ข้อใดแสดงว่าสมบัติทางกายภาพของพอลิเมอร์ต่างจากมอนอเมอร์ที่เป็นสารตั้งต้นอย่างชัดเจนที่สุด',
      c:['อีทีนเป็นแก๊ส แต่พอลิเอทิลีนเป็นของแข็งที่ขึ้นรูปได้','ทั้งคู่มีสูตรโมเลกุลเหมือนกัน','ทั้งคู่ละลายน้ำได้เท่ากัน','ทั้งคู่มีจุดหลอมเหลวเท่ากัน'], a:0,
      why:'ขนาดโมเลกุลที่ใหญ่ขึ้นมากทำให้แรงยึดเหนี่ยวระหว่างโมเลกุลรวมเปลี่ยนไปอย่างมาก' },
    { id:'q38', level:'Ev', topic:'13.5', q:'โรงงานอ้างว่า “เผาขยะพลาสติกทุกชนิดเพื่อผลิตพลังงานเป็นทางออกที่ดีที่สุด” ข้อโต้แย้งใดมีน้ำหนักที่สุด',
      c:['การเผาไม่ให้พลังงานเลย','พลาสติกบางชนิด เช่น PVC มีคลอรีน การเผาอาจเกิดแก๊สพิษ และการเผายังทำให้สูญเสียวัตถุดิบที่นำกลับมาใช้ได้','พลาสติกทุกชนิดเผาไม่ติด','การเผาทำให้เกิดมอนอเมอร์บริสุทธิ์'], a:1,
      why:'ต้องชั่งน้ำหนักทั้งมลพิษและการสูญเสียวัสดุที่ยังรีไซเคิลได้' },
    { id:'q39', level:'An', topic:'13.4', q:'พอลิเมอร์นำไฟฟ้าต่างจากโลหะตรงที่ต้องเติมสารเจือก่อนจึงนำไฟฟ้าได้ดี เหตุผลเชิงโครงสร้างคือข้อใด',
      c:['พอลิเมอร์ไม่มีอิเล็กตรอนเลย','ต้องมีระบบพันธะคู่สลับพันธะเดี่ยว แล้วสารเจือจึงช่วยให้อิเล็กตรอนเคลื่อนที่ไปตามสายได้','พอลิเมอร์มีการเชื่อมขวางเสมอ','พอลิเมอร์มีมวลโมเลกุลต่ำ'], a:1,

    if (!S.progress[k]) S.progress[k] = {};
  });

  if (!S.progress.log) S.progress.log = [];
  if (!S.progress.quiz) S.progress.quiz = [];

  S.setEndpoint = function (u) { S.endpoint = (u || '').trim(); save(K.ep, S.endpoint); S.flush(); };
  S.saveProgress = function () { save(K.prog, S.progress); };

  };

    return true;
  };

  S.record = function (row) {
    row.attempt_id = uid();
    row.session_id = S.sessionId;
    row.ts = new Date().toISOString();
    row.version = VERSION;
    row.name = S.profile ? S.profile.name : '';
    row.room = S.profile ? S.profile.room : '';
    row.no = S.profile ? S.profile.no : '';
    S.progress.log.push({ m: row.module, mi: row.mission_id, ok: row.result === 'ผ่าน', t: Date.now(),

/* ============================================================

(function (root) {

  /* ---- กล่องจำลองการจัดเรียงสายโซ่ (โมดูล 3) ----

    // เส้นกรอบกล่องบรรจุ

      s.push('<path d="' + d + '" fill="none" stroke="#7BB4FF" stroke-width="3.2" stroke-linecap="round" opacity="0.95"/>');
    }

   60_m2_reactor.js — โมดูล 2 : ปฏิกรณ์ (หัวข้อ 13.2)

(function (root) {
  'use strict';
  var S = root.PFLState, D = root.PFLData, E = root.PFLEngine, U = root.PFLUI,
      G = root.PFLSvg, A = root.PFLArt;
  var $ = U.$, esc = U.esc;

  var TRAP_CAP = 4, TARGET_DP = 12, STEP_MS = 190;

  var st = null;   // สถานะปัจจุบันของหน้าจอ

  function open(m) {
    st = { m: m, sel: [], kind: null, grown: 0, trap: 0, running: false,
           timer: null, rr: null, tries: 0, t0: Date.now(), drains: 0 };
    $('#m2-title').textContent = m.title;
    paint();
    U.show('v-m2');
  }

  function paint() {
    var m = st.m;
    $('#m2-body').innerHTML =
      A.banner('m2', 'a') +
      '<div class="brief"><div class="client">' + esc(m.client) + '</div>' +
      '<p>' + m.brief + '</p>' +
      '<details class="hint"><summary>ขอคำใบ้จากหัวหน้าฝ่ายผลิต</summary><p>' + esc(m.hint) + '</p></details></div>' +

      '<div class="stage" id="m2-stage"></div>' +
      '<div class="trap" id="m2-trap" hidden>' +
        '<span class="lbl">ถังดักโมเลกุลเล็ก</span>' +
        '<span class="traptube"><span class="trapfill" id="m2-fill"></span><span class="trapnum" id="m2-num"></span></span>' +
        '<button id="m2-drain">ระบายถัง</button></div>' +

      '<div class="card" style="margin-top:12px"><h2>ชนิดปฏิกิริยา</h2>' +
        '<div class="seg" id="m2-kind">' +
          '<button data-k="addition">แบบเติม</button>' +
          '<button data-k="condensation">แบบควบแน่น</button></div>' +
        '<p class="tiny" style="margin:8px 0 0" id="m2-kindnote">แบบเติมใช้กับมอนอเมอร์ที่มีพันธะคู่ · แบบควบแน่นใช้เมื่อหมู่ฟังก์ชันสองหมู่ทำปฏิกิริยากันแล้วมีโมเลกุลเล็กหลุดออก</p></div>' +

      '<div class="card"><h2>คลังมอนอเมอร์</h2>' +
        '<p class="tiny" style="margin:0 0 9px">เลือกได้ครั้งละไม่เกิน 2 ชนิด แตะซ้ำเพื่อเอาออก</p>' +
        '<div class="chips" id="m2-chips"></div></div>' +

      '<div id="m2-result"></div>';

    $('#m2-bar').innerHTML = '<button class="btn" id="m2-run">เดินเครื่องปฏิกรณ์</button>';

    $('#m2-chips').innerHTML = D.MONOMERS.map(function (x) {
      return '<button class="chip mono" data-id="' + x.id + '">' + A.monoGlyph(x) +
             '<span><b>' + esc(x.name) + '</b><i>' + esc(x.formula) + '</i></span></button>';
    }).join('');

    $('#m2-chips').querySelectorAll('[data-id]').forEach(function (b) {
      b.onclick = function () { toggleMonomer(b.dataset.id); };
    });
    $('#m2-kind').querySelectorAll('[data-k]').forEach(function (b) {
      b.onclick = function () { st.kind = b.dataset.k; stop(); syncUI(); };
    });
    $('#m2-run').onclick = run;
    $('#m2-drain').onclick = drain;
    syncUI();
  }

  function toggleMonomer(id) {
    var i = st.sel.indexOf(id);
    if (i >= 0) st.sel.splice(i, 1);
    else { if (st.sel.length >= 2) st.sel.shift(); st.sel.push(id); }
    stop(); syncUI();
  }

  function mons() {
    return st.sel.map(function (id) { return D.MONOMERS.filter(function (x) { return x.id === id; })[0]; });
  }

  function stop() {
    if (st.timer) { clearInterval(st.timer); st.timer = null; }
    st.running = false; st.grown = 0; st.trap = 0; st.rr = null;
    $('#m2-result').innerHTML = '';
  }

  function syncUI() {
    $('#m2-chips').querySelectorAll('[data-id]').forEach(function (b) {
      b.classList.toggle('sel', st.sel.indexOf(b.dataset.id) >= 0);
    });
    $('#m2-kind').querySelectorAll('[data-k]').forEach(function (b) {
      b.classList.toggle('on', st.kind === b.dataset.k);
    });
    $('#m2-run').disabled = !(st.sel.length && st.kind) || st.running;

    var trap = $('#m2-trap');
    trap.hidden = !(st.rr && st.rr.ok && st.rr.byproduct);
    if (!trap.hidden) {
      $('#m2-fill').style.width = (100 * st.trap / TRAP_CAP) + '%';
      $('#m2-num').textContent = st.rr.byproduct + '  ' + st.trap + '/' + TRAP_CAP;
      trap.classList.toggle('full', st.trap >= TRAP_CAP);
    }
    drawStage();
  }

  function drawStage() {
    var msg = '', cls = '';
    if (st.rr && !st.rr.ok) { msg = st.rr.reason; cls = 'bad'; }
    else if (st.running && st.trap >= TRAP_CAP) { msg = 'ถังดักเต็ม ปฏิกิริยาหยุดชะงัก — ระบายถังเพื่อให้สายโตต่อ'; cls = 'bad'; }
    var units = mons().map(function (x) { return { label: x.name.slice(0, 4), bulk: x.bulk }; });
    if (!units.length) units = [{ label: '?', bulk: 0 }];
    var svg = G.reactorStage({
      units: units, grown: st.rr && st.rr.ok ? st.grown : 0,
      capped: !!(st.rr && st.rr.terminator) && st.grown >= st.rr.maxDP / 2,
      bond: st.rr && st.rr.ok ? st.rr.bond : '', seed: st.sel.join('|') + st.kind
    });
    $('#m2-stage').innerHTML = svg + (msg ? '<div class="stagemsg ' + cls + '">' + esc(msg) + '</div>' : '');
  }

  function drain() {
    if (st.trap <= 0) return;
    st.trap = 0; st.drains++; syncUI();
  }

  function run() {
    var ms = mons();
    st.rr = E.react(ms, st.kind);
    st.grown = 0; st.trap = 0; st.tries++;
    $('#m2-result').innerHTML = '';
    if (!st.rr.ok) { syncUI(); return; }

    var cap = Math.min(TARGET_DP, st.rr.terminator ? 4 : TARGET_DP);
    st.running = true; syncUI();

    st.timer = setInterval(function () {
      if (st.trap >= TRAP_CAP) { syncUI(); return; }      // ถังเต็ม ปฏิกิริยาหยุด
      st.grown++;
      if (st.rr.byproduct) st.trap++;
      if (st.grown >= cap) { clearInterval(st.timer); st.timer = null; st.running = false; finish(); }
      syncUI();
    }, STEP_MS);
  }

  function finish() {
    var m = st.m, ms = mons();
    var chk = E.checkM2(m.need, st.rr, ms);
    var already = !!S.progress.m2[m.id];

    if (chk.allPass && !already) {
      S.progress.m2[m.id] = { tries: st.tries, at: Date.now() };
      if (m.resin) S.unlockResin(m.resin.id);
      S.saveProgress();
    } else if (chk.allPass && already) {
      if (m.resin) S.unlockResin(m.resin.id);
    }

    S.record({
      module: 'M2', mission_id: m.id, mission: m.title,
      monomers: st.sel.join('+'), reaction_type: st.kind,
      bond: st.rr.bond, byproduct: st.rr.byproduct || '-',
      imf: st.rr.imf, bulk: st.rr.bulk, terminator: st.rr.terminator || '-',
      spec_fit: chk.fit, result: chk.allPass ? 'ผ่าน' : 'ไม่ผ่าน',
      iteration: st.tries, drains: st.drains,
      seconds: Math.round((Date.now() - st.t0) / 1000),
      params: { k: st.kind, mon: st.sel.slice() }
    });

    $('#m2-result').innerHTML =
      '<div class="card"><h2>' + (chk.allPass ? 'ส่งมอบสำเร็จ' : 'ยังไม่ตรงตามใบสั่ง') + '</h2>' +
      '<ul class="checks">' + chk.rows.map(function (r) {
        return '<li class="' + (r.pass ? 'y' : 'n') + '"><span class="m">' + (r.pass ? '✓' : '✕') + '</span><span>' + esc(r.label) + '</span></li>';
      }).join('') + '</ul>' +
      (chk.allPass && m.resin
        ? '<p class="tiny" style="margin-top:10px">ได้ <b style="color:var(--molten)">' + esc(m.resin.name) +
          '</b> เพิ่มเข้าคลังเรซิน นำไปขึ้นรูปต่อในโมดูลสถาปนิกสายโซ่ได้</p>' : '') +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn ghost" id="m2-again">ลองใหม่</button>' +
      '<button class="btn" id="m2-next">' + (chk.allPass ? 'กลับไปรับใบสั่งถัดไป' : 'แก้ไขแบบ') + '</button></div></div>';

    $('#m2-again').onclick = function () { stop(); syncUI(); };
    $('#m2-next').onclick = function () {
      if (chk.allPass) { U.renderHome(); U.renderList('m2'); }
      else { stop(); syncUI(); }
    };
    if (chk.allPass) U.toast('ส่งมอบสำเร็จ');
    U.scrollBottom('#v-m2 .scroll');
  }

  root.PFLM2 = { open: open };
})(typeof window !== 'undefined' ? window : globalThis);

(function (root) {
  'use strict';
  var S = root.PFLState, D = root.PFLData, E = root.PFLEngine, U = root.PFLUI,
      G = root.PFLSvg, A = root.PFLArt;
  var $ = U.$, esc = U.esc;

  var GAUGES = [
    ['ความแน่นของการจัดเรียงสายโซ่', 'packing'],
    ['ความทนความร้อน', 'heat'],
    ['ความทนแรงดึง', 'tensile'],
    ['ความยืดหยุ่น', 'elastic'],
    ['ความสามารถในการอมน้ำ', 'waterIdx'],
    ['ต้นทุน', 'cost']
  ];

  var st = null;

  function available() {
    var ids = D.STARTER_RESINS.slice();
    S.progress.resins.forEach(function (r) { if (ids.indexOf(r) < 0) ids.push(r); });
    return ids.map(function (id) { return D.RESINS[id]; }).filter(Boolean);
  }

  function open(m) {
    var res = available();
    st = { m: m, resin: res[0], n: 50, branch: 0, xlink: 0,
           tested: false, props: null, tries: 0, tests: 0, t0: Date.now() };
    $('#m3-title').textContent = m.title;
    paint();
    U.show('v-m3');
  }

  function keysNeeded() {
    var ks = st.m.spec.map(function (c) { return c.key; });
    var out = GAUGES.filter(function (g) { return ks.indexOf(g[1]) >= 0; });
    GAUGES.forEach(function (g) { if (out.length < 4 && out.indexOf(g) < 0) out.push(g); });
    return out.slice(0, 4);
  }

  function paint() {
    var m = st.m, res = available();
    $('#m3-body').innerHTML =
      A.banner('m3', 'b') +
      '<div class="brief"><div class="client">' + esc(m.client) + '</div>' +
      '<p>' + esc(m.brief) + '</p>' +
      '<ul class="checks" style="margin-top:9px" id="m3-spec"></ul>' +
      '<details class="hint"><summary>ขอคำใบ้จากหัวหน้าฝ่ายผลิต</summary><p>' + esc(m.hint) + '</p></details></div>' +

      '<div class="split"><div class="left">' +
      '<div class="stage" id="m3-stage"></div>' +

      '<div class="card" style="margin-top:12px"><h2>เรซินตั้งต้น</h2>' +
      '<div class="chips" id="m3-resins">' + res.map(function (r) {
        return '<button class="chip" data-r="' + r.id + '"><b>' + esc(r.name) + '</b><i>' +
               (r.imf === 3 ? 'พันธะไฮโดรเจน' : r.imf === 2 ? 'แรงระหว่างขั้ว' : 'แรงลอนดอน') +
               ' · หมู่ข้างเคียง ' + ['ไม่มี', 'เล็ก', 'ปานกลาง', 'ใหญ่'][r.bulk] + '</i></button>';
      }).join('') + '</div>' +
      '<p class="tiny" style="margin:9px 0 0">ผ่านใบสั่งในโมดูลปฏิกรณ์เพื่อปลดล็อกเรซินเพิ่ม</p></div>' +

      '<div class="card"><h2>โครงสร้างสายโซ่</h2>' +
        sl('n', 'ความยาวสายโซ่', 5, 100, 1, 'จำนวนหน่วยซ้ำต่อสาย') +
        sl('branch', 'ความถี่ของกิ่ง', 0, 100, 5, 'สายโซ่ด้านข้างที่แยกออกมาจากสายหลัก') +
        sl('xlink', 'ตัวเชื่อมขวาง', 0, 100, 5, 'สะพานที่เชื่อมระหว่างสายโซ่หลักมากกว่าหนึ่งสาย') +

      '<div class="right"><div class="card"><h2>แท่นทดสอบ</h2>' +
      '<div id="m3-gauges"></div>' +
      '<p class="tiny" id="m3-heat"></p></div>' +
      '<div id="m3-result"></div></div></div>';

    $('#m3-bar').innerHTML =
      '<button class="btn ghost" id="m3-test">รันชุดทดสอบ</button>' +
      '<button class="btn" id="m3-ship" disabled>ส่งมอบ</button>';

    $('#m3-resins').querySelectorAll('[data-r]').forEach(function (b) {
      b.onclick = function () { st.resin = D.RESINS[b.dataset.r]; invalidate(); };
    });

      $('#sl-' + k).addEventListener('input', function (e) {
        st[k] = k === 'n' ? +e.target.value : (+e.target.value) / 100;
        invalidate();
      });

    $('#m3-test').onclick = doTest;
    $('#m3-ship').onclick = ship;
    invalidate();
  }

  function sl(id, label, min, max, step, cap) {
    return '<div class="sl"><div class="top"><b>' + esc(label) + '</b><span id="v-' + id + '"></span></div>' +
      '<input type="range" id="sl-' + id + '" min="' + min + '" max="' + max + '" step="' + step + '" value="0">' +
      '<div class="cap">' + esc(cap) + '</div></div>';
  }

  function current() {
    var r = st.resin;
    return E.simulate({ imf: r.imf, bulk: r.bulk, n: st.n, branch: st.branch, xlink: st.xlink,

  }

  function invalidate() {
    st.tested = false;
    st.props = null;
    $('#m3-ship').disabled = true;
    $('#m3-resins').querySelectorAll('[data-r]').forEach(function (b) {
      b.classList.toggle('sel', b.dataset.r === st.resin.id);

    $('#sl-branch').value = Math.round(st.branch * 100); $('#v-branch').textContent = Math.round(st.branch * 100) + '%';
    $('#sl-xlink').value = Math.round(st.xlink * 100); $('#v-xlink').textContent = Math.round(st.xlink * 100) + '%';
    drawStage();
    drawGauges();

    if (c.op === 'range') return 'ระหว่าง ' + c.value[0] + '–' + c.value[1];
    if (c.key === 'recyclable') return '';

  }

  function drawStage() {
    var p = current();   // ใช้เฉพาะค่าที่มองเห็นได้ ไม่เปิดเผยตัวเลขสมบัติ
    var r = G.packBox({ packing: p.packing, branch: st.branch, xlink: st.xlink, bulk: st.resin.bulk,

      return U.gaugeHTML(g[0], g[1], p ? p[g[1]] : 0, st.m.spec, st.tested);
    }).join('') +
    (function () {
      var c = st.m.spec.filter(function (x) { return x.key === 'recyclable'; })[0];
      if (!c) return '';
      var ok = st.tested && p.recyclable === c.value;

/* ===== 72_m4_tuning.js ===== */
/* ============================================================
   72_m4_tuning.js — โมดูล 4 : โต๊ะปรับแต่ง (13.4)
   แบ่งเป็น 4 สถานี — สารเติมแต่ง · วัลคาไนเซชัน · โคพอลิเมอร์ · การเติมสารเจือ

(function (root) {
  'use strict';
  var S = root.PFLState, D = root.PFLData, E = root.PFLEngine, U = root.PFLUI,
      G = root.PFLSvg, A = root.PFLArt;
  var $ = U.$, esc = U.esc;

  var GA = [['ความยืดหยุ่น','elastic'],['ความทนความร้อน','heat'],['ความทนแรงดึง','tensile'],
            ['การนำไฟฟ้า','cond'],['ความทนรังสียูวี','uvResist'],['ต้นทุน','cost'],
            ['ความแน่นของการจัดเรียงสายโซ่','packing']];
  var N_FIXED = 70;
  var st = null;

  function resins() {
    var ids = D.STARTER_RESINS.slice();
    S.progress.resins.forEach(function (r) { if (ids.indexOf(r) < 0) ids.push(r); });
    return ids.map(function (i) { return D.RESINS[i]; }).filter(Boolean);
  }

  function open(m) {
    st = { m:m, tab: m.station || 'additive', resin: resins()[0],
           plast:0, filler:0, uvStab:false,
           sulfur:0, cured:false,
           partner:null, arrange:'block', frac:50,
           dopant:null,
           tested:false, props:null, tries:0, tests:0, cures:0, t0:Date.now() };
    $('#m4-title').textContent = m.title;
    paint(); U.show('v-m4');
  }

  function mix() {
    var Ar = st.resin, f = st.partner ? st.frac / 100 : 0;
    var B = st.partner ? D.RESINS[st.partner] : Ar;
    var ar = D.ARRANGE.filter(function (a) { return a.id === st.arrange; })[0];
    return {
      imf: Ar.imf * (1 - f) + B.imf * f,
      bulk: Ar.bulk * (1 - f) + B.bulk * f,
      cost: Ar.cost * (1 - f) + B.cost * f + (st.dopant ? 18 : 0),
      conj: Ar.conj && (!st.partner || B.conj),
      packMul: 1 - (1 - ar.packMul) * f
    };
  }

  function current() {
    var mx = mix();
    return E.simulate({ imf:mx.imf, bulk:mx.bulk, n:N_FIXED, branch:0,
      xlink: st.cured ? st.sulfur / 100 * 0.8 : 0,
      plast: st.plast / 100 * 0.8, filler: st.filler / 100, uvStab: st.uvStab,
      conj: mx.conj, doped: !!st.dopant, cost: mx.cost, packMul: mx.packMul });
  }

  function keys() {
    var ks = st.m.spec.map(function (c) { return c.key; });
    var out = GA.filter(function (g) { return ks.indexOf(g[1]) >= 0; });
    GA.forEach(function (g) { if (out.length < 4 && out.indexOf(g) < 0) out.push(g); });
    return out.slice(0, 4);
  }

      '<div class="split"><div class="left">' +

      '<div class="card"><h2>สถานีปรับแต่ง</h2>' +

    $('#m4-ship').onclick = ship;

  function sl(id, label, val, cap, en) {

      (en ? '<em>' + esc(en) + '</em>' : '') + '</b><span>' + val + '%</span></div>' +
      '<input type="range" data-sl="' + id + '" min="0" max="100" step="5" value="' + val + '">' +
      '<div class="cap">' + esc(cap) + '</div></div>';
  }

  function panelHTML() {
    if (st.tab === 'additive') {
      return sl('plast', D.ADDITIVES[0].name, st.plast, D.ADDITIVES[0].note, D.ADDITIVES[0].en) +
        sl('filler', D.ADDITIVES[1].name, st.filler, D.ADDITIVES[1].note, D.ADDITIVES[1].en) +
        '<label class="toggle"><input type="checkbox" data-cb="uvStab"' + (st.uvStab ? ' checked' : '') + '><span></span>' +
        '<div><b>' + esc(D.UVSTAB.name) + ' <em>' + esc(D.UVSTAB.en) + '</em></b><i>' +
        esc(D.UVSTAB.note) + '</i></div></label>';
    }
    if (st.tab === 'vulcan') {
      return sl('sulfur', 'ปริมาณกำมะถัน', st.sulfur,
                'กำมะถันที่ผสมลงในเนื้อยาง ยังไม่ทำปฏิกิริยาจนกว่าจะบ่ม', 'Sulfur') +
        '<div class="cure ' + (st.cured ? 'done' : '') + '">' +
        '<div><b>' + (st.cured ? 'บ่มแล้ว — เกิดสะพานกำมะถันเชื่อมระหว่างสายโซ่' :
                      st.sulfur > 0 ? 'ยังไม่บ่ม — กำมะถันผสมอยู่เฉย ๆ ยังไม่เกิดพันธะ' :
                      'ยังไม่ได้ใส่กำมะถัน') + '</b></div>' +
        '<button class="btn ' + (st.cured ? 'ghost' : '') + '" data-act="cure"' + (st.sulfur > 0 ? '' : ' disabled') + '>' +
        (st.cured ? 'ยกเลิกการบ่ม' : 'บ่มด้วยความร้อน') + '</button></div>';
    }
    if (st.tab === 'copoly') {
      var ar = D.ARRANGE.filter(function (a) { return a.id === st.arrange; })[0];
      return '<p class="tiny" style="margin:0 0 9px">เลือกพอลิเมอร์อีกชนิดมาต่อรวมในสายเดียวกัน</p>' +
        '<div class="chips" id="m4-partner"><button class="chip" data-p=""><b>ไม่ใช้</b><i>โฮโมพอลิเมอร์</i></button>' +

          return '<button class="chip" data-p="' + r.id + '"><b>' + esc(r.name) + '</b><i>ผสมเข้าไปในสาย</i></button>'; }).join('') +
        '</div>' + (st.partner ?
          '<div class="seg" id="m4-arr" style="margin-top:12px">' +
          D.ARRANGE.map(function (a) {
            return '<button data-a="' + a.id + '">' + esc(a.name) + '<em>' + esc(a.en) + '</em></button>'; }).join('') + '</div>' +

             'ยิ่งมาก สมบัติยิ่งเข้าใกล้พอลิเมอร์ชนิดที่สอง', 'Comonomer fraction') : '');

               '</em></b><i>' + esc(x.note) + '</i></button>'; }).join('') +
      '</div>';
  }

  function inval() {
    st.tested = false; st.props = null;
    $('#m4-ship').disabled = true;

  }

  function used(t) {
    if (t === 'additive') return st.plast > 0 || st.filler > 0 || st.uvStab;
    if (t === 'vulcan') return st.sulfur > 0;

      '<div class="brief"><div class="client">' + esc(m.client) + '</div><p>' + esc(m.goal) + '</p>' +
      '<details class="hint"><summary>ขอคำใบ้จากหัวหน้าฝ่ายผลิต</summary><p>' + esc(m.hint) + '</p></details></div>' +

      '<div class="card"><h2>วัสดุที่รับเข้ามา</h2>' +
      '<div class="wasteid">' + A.objArt(w.name, 'objart big') +
      '<div><b>' + esc(w.name) + '</b><i>' + esc(w.unit) + '</i></div>' +
      (w.code ? A.tri(w.code) : '') + '</div></div>' +

      '<div class="card"><h2>ขั้นที่ 1 · ระบุพันธะที่จะตัด</h2>' +
      '<p class="tiny" style="margin:0 0 9px">เลือกพันธะในสายโซ่ที่คิดว่าเป็นจุดอ่อนของวัสดุนี้</p>' +
      '<div class="chips" id="m5-bonds">' + w.bonds.map(function (b) {
        return '<button class="chip wide" data-b="' + b.id + '"><b>' + esc(b.label) + '</b></button>'; }).join('') +
      '</div><p class="tiny" id="m5-bondmsg" style="margin-top:9px"></p></div>' +

      '<div class="card" id="m5-agents" hidden><h2>ขั้นที่ 2 · เลือกวิธีแยกสลาย</h2>' +
      '<div class="chips">' + Object.keys(DG.AGENTS).map(function (k) {
        return '<button class="chip wide" data-a="' + k + '"><b>' + esc(DG.AGENTS[k].name) + '</b></button>'; }).join('') +
      '</div></div>' +

      '<div id="m5-out"></div>';

    $('#m5-bonds').querySelectorAll('[data-b]').forEach(function (b) {
      b.onclick = function () { pickBond(b.dataset.b); }; });
    $('#m5-agents').querySelectorAll('[data-a]').forEach(function (b) {
      b.onclick = function () { runAgent(b.dataset.a); }; });
  }

  function pickBond(id) {
    var w = st.w, b = w.bonds.filter(function (x) { return x.id === id; })[0];
    $('#m5-bonds').querySelectorAll('[data-b]').forEach(function (el) {
      el.classList.toggle('sel', el.dataset.b === id); });
    if (b.ok) {
      st.bond = id;
      $('#m5-bondmsg').innerHTML = '<span style="color:var(--pass)">ถูกต้อง — พันธะนี้คือจุดที่กำหนดว่าวิธีใดใช้ได้กับวัสดุนี้</span>';
      $('#m5-agents').hidden = false;
    } else {
      st.wrongBond++;
      st.bond = null;
      $('#m5-agents').hidden = true;
      $('#m5-bondmsg').innerHTML = '<span style="color:var(--fail)">พันธะนี้ไม่ใช่จุดที่ถูกตัดในการแยกสลาย ลองดูว่าพันธะใดในสายโซ่หลักเชื่อมหน่วยซ้ำเข้าด้วยกัน</span>';
    }
  }

  function runAgent(a) {
    st.agent = a; st.tries++;
    var r = DG.degrade(st.w, a);
    st.res = r;
    var need = st.m.need, ok;
    if (need.demonstrate) ok = (a === need.demonstrate);
    else {
      ok = r.ok && r.scission && r.yield >= (need.minYield || 0);
      if (ok && need.product)
        ok = r.products.some(function (x) { return x.indexOf(need.product) >= 0; });
    }

    if (ok && !S.progress.m5[st.m.id]) {
      S.progress.m5[st.m.id] = { tries: st.tries, at: Date.now() }; S.saveProgress();
    }
    S.record({ module:'M5', mission_id:st.m.id, mission:st.m.title, waste:st.w.id,
      backbone:st.w.backbone, bond:st.bond || '-', agent:a, outcome:r.title,
      yield:r.yield, wrong_bond:st.wrongBond,
      spec_fit: ok ? 100 : Math.min(90, r.yield), result: ok ? 'ผ่าน' : 'ไม่ผ่าน',
      iteration:st.tries, seconds: Math.round((Date.now() - st.t0) / 1000),
      params:{ a:a, y:r.yield } });

    $('#m5-out').innerHTML =
      '<div class="card"><h2>' + esc(r.title) + '</h2>' +
      '<div class="yieldbar"><span style="width:' + r.yield + '%"></span></div>' +
      '<p class="tiny" style="margin:4px 0 10px">ผลได้ของสารที่นำกลับไปใช้ได้ ' + r.yield + '%</p>' +
      '<p style="font-size:14.5px;margin:0">' + esc(r.detail) + '</p>' +
      (r.products.length ? '<p class="tiny" style="margin-top:9px">ได้ผลิตภัณฑ์: <b style="color:var(--molten)">' +
        r.products.map(esc).join(' · ') + '</b></p>' : '') +
      '<div class="verdict ' + (ok ? 'y' : 'n') + '">' +
        (ok ? 'บรรลุเป้าหมายของใบสั่งนี้' : 'ยังไม่บรรลุเป้าหมาย — ลองวิธีอื่นแล้วเทียบผลกัน') + '</div>' +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn ghost" id="m5-again">ลองวิธีอื่น</button>' +
      '<button class="btn" id="m5-back">กลับรายการใบสั่ง</button></div></div>';

    $('#m5-again').onclick = function () { $('#m5-out').innerHTML = ''; };
    $('#m5-back').onclick = function () { U.renderHome(); U.renderList('m5'); };
    if (ok) U.toast('บรรลุเป้าหมาย');
    U.scrollBottom('#v-m5 .scroll');
  }

  root.PFLM5 = { open: open };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 76_m6_sorting.js ===== */
/* ============================================================
   76_m6_sorting.js — มินิเกมแยกขยะตามรหัสพลาสติก 1–7
   คำใบ้เป็น "สมบัติ" ไม่ใช่ชื่อย่อ ผู้เล่นจึงต้องอนุมานจากสมบัติสู่ชนิดพอลิเมอร์
   ============================================================ */
(function (root) {
  'use strict';
  var S = root.PFLState, D = root.PFLData, U = root.PFLUI, A = root.PFLArt;
  var $ = U.$, esc = U.esc;

  var ROUND = 12, LIVES = 3, TIME = 100;
  var st = null, tick = null;

  function shuffle(a, rnd) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor((rnd ? rnd() : Math.random()) * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function open() {
    $('#m6-title').textContent = 'แยกขยะตามรหัสพลาสติก';
    intro(); U.show('v-m6');
  }

  function intro() {
    stopTick();
    var best = S.progress.m6best || 0;
    $('#m6-body').innerHTML =
      A.banner('m6', 'e') +
      '<div class="brief"><div class="client">ศูนย์คัดแยกขยะชุมชน</div>' +
      '<p>ของถูกส่งมาทีละชิ้นพร้อม<b>คำใบ้เชิงสมบัติ</b> ไม่มีชื่อย่อบอก ' +
      'ให้ทิ้งลงถังที่ถูกต้องภายในเวลาที่กำหนด ผิดได้ ' + LIVES + ' ครั้ง</p></div>' +

      '<div class="card"><h2>ถังทั้ง 7 ใบ</h2><div class="codetable">' +
      D.CODES.map(function (c) {
        return '<div class="coderow">' + A.tri(c.n) + '<div><b>' + c.abbr + '</b> ' +
               esc(c.name) + '<i>' + esc(c.tip) + '</i></div></div>'; }).join('') + '</div></div>' +

      (best ? '<p class="tiny" style="text-align:center">คะแนนสูงสุดของคุณ ' + best + '</p>' : '') +
      '<button class="btn" id="m6-go">เริ่มคัดแยก</button>';
    $('#m6-go').onclick = start;
  }

  function start() {
    st = { queue: shuffle(D.TRASH).slice(0, ROUND), i:0, score:0, streak:0, best:0,
           lives:LIVES, time:TIME, wrong:[], t0:Date.now(), done:false };
    render();
    tick = setInterval(function () {
      if (!st || st.done) return;
      st.time--;
      var el = $('#m6-time'); if (el) el.textContent = st.time;
      var bar = $('#m6-timebar'); if (bar) bar.style.width = (100 * st.time / TIME) + '%';
      if (st.time <= 0) finish();
    }, 1000);
  }
  function stopTick() { if (tick) { clearInterval(tick); tick = null; } }

  function render() {
    var it = st.queue[st.i];
    $('#m6-body').innerHTML =
      '<div class="hud"><span>ชิ้นที่ ' + (st.i + 1) + '/' + ROUND + '</span>' +
      '<span>คะแนน <b id="m6-score">' + st.score + '</b></span>' +
      '<span>ต่อเนื่อง <b>' + st.streak + '</b></span>' +
      '<span>' + '♥'.repeat(st.lives) + '<span style="opacity:.25">' + '♥'.repeat(LIVES - st.lives) + '</span></span>' +
      '<span><b id="m6-time">' + st.time + '</b> วิ</span></div>' +
      '<div class="timetrack"><span id="m6-timebar" style="width:' + (100 * st.time / TIME) + '%"></span></div>' +

      '<div class="card item">' + A.objArt(it.name, 'objart big') +
      '<h2 style="font-size:19px">' + esc(it.name) + '</h2>' +
      '<p class="clue">' + esc(it.clue) + '</p></div>' +

      '<div class="bins" id="m6-bins">' + D.CODES.map(function (c) {
        return '<button class="bin" data-n="' + c.n + '">' + A.tri(c.n) + '<b>' + c.abbr + '</b></button>'; }).join('') +
      '</div><div id="m6-fb"></div>';

    $('#m6-bins').querySelectorAll('[data-n]').forEach(function (b) {
      b.onclick = function () { answer(+b.dataset.n); }; });
  }

  function answer(n) {
    var it = st.queue[st.i], ok = (n === it.code);
    var code = D.CODES.filter(function (c) { return c.n === it.code; })[0];
    if (ok) { st.streak++; st.score += 10 + Math.min(10, st.streak * 2); }
    else { st.lives--; st.streak = 0; st.wrong.push([it.name, code]); }

    $('#m6-bins').querySelectorAll('[data-n]').forEach(function (b) {
      if (+b.dataset.n === it.code) b.classList.add('right');
      else if (+b.dataset.n === n && !ok) b.classList.add('wrong');
      b.disabled = true;
    });
    $('#m6-fb').innerHTML = '<div class="verdict ' + (ok ? 'y' : 'n') + '">' +
      (ok ? 'ถูกต้อง' : 'ถังที่ถูกคือหมายเลข ' + it.code) + ' — ' + esc(code.abbr) + ' ' + esc(code.name) +
      '<br><span style="opacity:.85">' + esc(code.tip) + '</span></div>' +
      '<button class="btn" id="m6-next" style="margin-top:10px">' +
      (st.i + 1 >= ROUND || st.lives <= 0 ? 'ดูผลรวม' : 'ชิ้นถัดไป') + '</button>';
    $('#m6-score').textContent = st.score;
    $('#m6-next').onclick = function () {
      if (st.i + 1 >= ROUND || st.lives <= 0) finish();
      else { st.i++; render(); }
    };
    U.scrollBottom('#v-m6 .scroll');
  }

  function finish() {
    if (st.done) return;
    st.done = true; stopTick();
    var right = ROUND - st.wrong.length - (ROUND - st.i - 1) * 0;
    var answered = Math.min(st.i + 1, ROUND);
    var correct = answered - st.wrong.length;
    var pct = Math.round(100 * correct / Math.max(1, answered));
    if (st.score > (S.progress.m6best || 0)) S.progress.m6best = st.score;
    S.progress.m6plays = (S.progress.m6plays || 0) + 1;
    if (pct >= 75) S.progress.m6 = { pass:true, score:st.score, at:Date.now() };
    S.saveProgress();

    S.record({ module:'M6', mission_id:'m6-sort', mission:'แยกขยะตามรหัสพลาสติก',
      score:st.score, answered:answered, correct:correct, accuracy:pct,
      lives_left:st.lives, seconds: Math.round((Date.now() - st.t0) / 1000),
      spec_fit:pct, result: pct >= 75 ? 'ผ่าน' : 'ไม่ผ่าน', iteration:S.progress.m6plays });

    $('#m6-body').innerHTML =
      '<div class="card" style="text-align:center"><h2 style="font-size:20px">' +
      (pct >= 75 ? 'คัดแยกได้ดี' : 'ยังต้องฝึกอีกหน่อย') + '</h2>' +
      '<div class="bigscore">' + st.score + '</div>' +
      '<p class="muted" style="margin:0">ถูก ' + correct + ' จาก ' + answered + ' ชิ้น (' + pct + '%)</p></div>' +
      (st.wrong.length ? '<div class="card"><h2>ทบทวนชิ้นที่พลาด</h2><ul class="checks">' +
        st.wrong.map(function (w) {
          return '<li class="n"><span class="m">' + w[1].n + '</span><span><b>' + esc(w[0]) + '</b> คือ ' +
                 esc(w[1].abbr) + ' — ' + esc(w[1].tip) + '</span></li>'; }).join('') + '</ul></div>' : '') +
      '<div class="row"><button class="btn ghost" id="m6-again">เล่นอีกครั้ง</button>' +
      '<button class="btn" id="m6-home">กลับหน้าหลัก</button></div>';
    $('#m6-again').onclick = intro;
    $('#m6-home').onclick = function () { U.renderHome(); U.show('v-home'); };
  }

  root.PFLM6 = { open: open };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 80_codex.js ===== */
/* ============================================================
   80_codex.js — บันทึกวิศวกร (สรุปความรู้แยกจากวงจรการเล่น)
   ปลดล็อกเมื่อผ่านใบสั่งครบทุกใบในโมดูล
   ============================================================ */
(function (root) {
  'use strict';
  var S = root.PFLState, D = root.PFLData, U = root.PFLUI, A = root.PFLArt;
  var $ = U.$, esc = U.esc;

  /* ---- สถิติจากการเล่นของนักเรียนคนนี้เอง ---- */
  function stats(mod) {
    var tag = mod.toUpperCase();
    var log = S.progress.log.filter(function (r) { return r.m === tag; });
    var out = { attempts: log.length, passed: log.filter(function (r) { return r.ok; }).length, lines: [] };
    if (mod === 'm2') {
      var add = log.filter(function (r) { return r.p && r.p.k === 'addition'; }).length;
      var con = log.filter(function (r) { return r.p && r.p.k === 'condensation'; }).length;
      out.lines.push('คุณเดินเครื่องปฏิกรณ์ทั้งหมด ' + out.attempts + ' ครั้ง ผ่านใบสั่ง ' + out.passed + ' ครั้ง');
      out.lines.push('ใช้ปฏิกิริยาแบบเติม ' + add + ' ครั้ง และแบบควบแน่น ' + con + ' ครั้ง');
      var two = log.filter(function (r) { return r.p && r.p.mon && r.p.mon.length === 2; }).length;
      out.lines.push('มีการใช้มอนอเมอร์ 2 ชนิดพร้อมกัน ' + two + ' ครั้ง — พอลิเมอร์ไม่จำเป็นต้องมาจากมอนอเมอร์ชนิดเดียว');
    } else if (mod === 'm3') {
      var lin = log.filter(function (r) { return r.p && r.p.b <= 0.1; });
      var bra = log.filter(function (r) { return r.p && r.p.b > 0.35; });
      var net = log.filter(function (r) { return r.p && r.p.x >= 0.06; });
      var avg = function (a, k) { return a.length ? (a.reduce(function (s, r) { return s + r.p[k]; }, 0) / a.length) : 0; };
      out.lines.push('คุณส่งมอบงานทั้งหมด ' + out.attempts + ' ครั้ง ลูกค้ารับมอบ ' + out.passed + ' ครั้ง');
      if (lin.length && bra.length)
        out.lines.push('คุณทดลองโครงสร้างแบบเส้น ' + lin.length + ' ครั้ง และแบบกิ่ง ' + bra.length +
                       ' ครั้ง โดยแบบกิ่งที่คุณสร้างมีความถี่กิ่งเฉลี่ย ' + Math.round(avg(bra, 'b') * 100) + '%');
      out.lines.push('มีการใส่ตัวเชื่อมขวางจนกลายเป็นโครงสร้างแบบร่างแห ' + net.length +
                     ' ครั้ง ซึ่งทุกครั้งนั้นวัสดุจะหลอมขึ้นรูปใหม่ไม่ได้');
      var best = Object.keys(S.progress.m3).map(function (k) { return S.progress.m3[k]; });
      if (best.length) out.lines.push('ใบสั่งที่ผ่านแล้ว ' + best.length + ' ใบ ใช้การส่งมอบเฉลี่ย ' +
        (best.reduce(function (s, b) { return s + (b.tries || 1); }, 0) / best.length).toFixed(1) + ' ครั้งต่อใบ');
    } else if (mod === 'm4') {
      var sul = log.filter(function (r) { return r.p && r.p.s > 0; });
      var pl  = log.filter(function (r) { return r.p && r.p.pl > 0; });
      var co  = log.filter(function (r) { return r.p && r.p.co; });
      var avg = function (a, k) { return a.length ? Math.round(a.reduce(function (s, r) { return s + r.p[k]; }, 0) / a.length) : 0; };
      out.lines.push('คุณส่งมอบสูตรที่ปรับแต่งแล้วทั้งหมด ' + out.attempts + ' ครั้ง ลูกค้ารับมอบ ' + out.passed + ' ครั้ง');
      out.lines.push('ใช้กำมะถัน ' + sul.length + ' ครั้ง (เฉลี่ย ' + avg(sul, 's') + '%) และใช้พลาสติไซเซอร์ ' +
        pl.length + ' ครั้ง (เฉลี่ย ' + avg(pl, 'pl') + '%)');
      out.lines.push('ทดลองทำโคพอลิเมอร์ ' + co.length + ' ครั้ง — การเรียงลำดับหน่วยซ้ำที่ต่างกันให้สมบัติต่างกันแม้ใช้มอนอเมอร์ชุดเดิม');
    } else if (mod === 'm5') {
      var byA = {};
      log.forEach(function (r) { if (r.p && r.p.a) byA[r.p.a] = (byA[r.p.a] || 0) + 1; });
      var names = { heat:'ความร้อน', acid:'กรด+น้ำ', base:'เบส+น้ำ', uv:'ยูวี', micro:'จุลินทรีย์' };
      out.lines.push('คุณทดลองแยกสลายทั้งหมด ' + out.attempts + ' ครั้ง บรรลุเป้าหมาย ' + out.passed + ' ครั้ง');
      out.lines.push('วิธีที่ใช้: ' + (Object.keys(byA).map(function (k) { return names[k] + ' ' + byA[k] + ' ครั้ง'; }).join(' · ') || 'ยังไม่มีข้อมูล'));
      var got = log.filter(function (r) { return r.p && r.p.y >= 70; }).length;
      out.lines.push('มี ' + got + ' ครั้งที่ได้ผลได้ตั้งแต่ 70% ขึ้นไป ซึ่งเกิดขึ้นเฉพาะเมื่อเลือกวิธีให้ตรงกับพันธะในสายโซ่');
    }
    return out;
  }

  function unlocked(mod) { return S.moduleDone(mod, { m2:D.M2, m3:D.M3, m4:D.M4, m5:D.M5 }[mod]); }

  function render() {
    var mods = [['m2', D.CODEX.m2], ['m3', D.CODEX.m3], ['m4', D.CODEX.m4], ['m5', D.CODEX.m5]];
    $('#codex-body').innerHTML = A.banner('codex', 'h') + mods.map(function (p) {
      var ok = unlocked(p[0]);
      return '<button class="mission' + (ok ? ' done' : '') + '" data-c="' + p[0] + '"' + (ok ? '' : ' disabled') + '>' +
        '<span class="st">' + (ok ? '✓' : '🔒') + '</span><span class="tx"><b>' + esc(p[1].title) + '</b><i>' +
        (ok ? p[1].ref : 'ผ่านใบสั่งให้ครบทุกใบในโมดูลนี้ก่อน') + '</i></span></button>';
    }).join('') +
    '<p class="tiny" style="margin-top:14px">บันทึกวิศวกรเป็นสรุปความรู้ที่แยกออกจากการเล่น ' +
    'เปิดอ่านย้อนหลังได้ตลอด และบันทึกเป็นภาพเก็บไว้ในเครื่องได้</p>';

    $('#codex-body').querySelectorAll('[data-c]').forEach(function (b) {
      if (!b.disabled) b.onclick = function () { openCard(b.dataset.c); };
    });
  }

  function openCard(mod) {
    var c = D.CODEX[mod], s = stats(mod);
    $('#codex-body').innerHTML =
      '<div class="card codex">' +
      '<h2 style="font-size:18px">' + esc(c.title) + '</h2>' +
      '<p class="tiny" style="margin:2px 0 0">' + esc(c.ref) + '</p>' +

      '<h3>สาระสำคัญ</h3><ul>' + c.core.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +

      '<h3>คำถามที่ยังค้างไว้</h3><div class="cliff">' + esc(c.cliff) + '</div>' +

      '<button class="btn ghost" id="cx-png" style="margin-top:16px">บันทึกเป็นภาพ</button>' +
      '<button class="btn ghost" id="cx-back" style="margin-top:8px">กลับไปชั้นวางบันทึก</button>' +

  /* ---- ส่งออกการ์ดเป็น PNG ---- */
  function toPNG(c, s) {
    var W = 1000, pad = 56, dpr = 2;
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    var FS = getComputedStyle(document.body).fontFamily;

    // วัดความสูงที่ต้องใช้ก่อน
    var blocks = [];
    blocks.push(['h', c.title]); blocks.push(['s', c.ref]);
    blocks.push(['h3', 'สาระสำคัญ']); c.core.forEach(function (x) { blocks.push(['li', x]); });
    blocks.push(['h3', 'หลักฐานจากการเล่นของคุณเอง']); s.lines.forEach(function (x) { blocks.push(['li', x]); });
    blocks.push(['h3', 'จุดที่คนมักเข้าใจผิด']);
    c.myth.forEach(function (m) { blocks.push(['bad', 'เข้าใจผิด — ' + m[0]]); blocks.push(['good', 'เข้าใจถูก — ' + m[1]]); });
    blocks.push(['h3', 'คำถามที่ยังค้างไว้']); blocks.push(['cliff', c.cliff]);
    var who = (S.profile ? S.profile.name + '  ห้อง ' + S.profile.room + ' เลขที่ ' + S.profile.no : '') +
              '   ·   ' + new Date().toLocaleDateString('th-TH');
    blocks.push(['s', who]);

    function fontFor(t) {
      if (t === 'h') return '700 40px ' + FS;
      if (t === 'h3') return '600 27px ' + FS;
      if (t === 's') return '400 21px ' + FS;
      return '400 25px ' + FS;
    }
    function wrap(text, maxW) {
      var words = String(text).split(/(\s+)/), lines = [], cur = '';
      for (var i = 0; i < words.length; i++) {
        var test = cur + words[i];
        if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i].replace(/^\s+/, ''); }
        else cur = test;
      }
      if (cur) lines.push(cur);
      // ตัดคำไทยยาวที่ไม่มีช่องว่าง
      var out = [];
      lines.forEach(function (L) {
        while (ctx.measureText(L).width > maxW) {
          var k = L.length;
          while (k > 1 && ctx.measureText(L.slice(0, k)).width > maxW) k--;
          out.push(L.slice(0, k)); L = L.slice(k);
        }
        out.push(L);
      });
      return out;
    }

    var maxW = W - pad * 2 - 26, y = pad, plan = [];
    blocks.forEach(function (b) {
      ctx.font = fontFor(b[0]);
      var ls = wrap(b[1], b[0] === 'li' || b[0] === 'bad' || b[0] === 'good' || b[0] === 'cliff' ? maxW : W - pad * 2);
      var lh = b[0] === 'h' ? 52 : b[0] === 's' ? 30 : b[0] === 'h3' ? 40 : 36;
      var top = y + (b[0] === 'h3' ? 26 : b[0] === 'h' ? 0 : 6);
      plan.push({ t: b[0], lines: ls, y: top, lh: lh });
      y = top + ls.length * lh + (b[0] === 'bad' || b[0] === 'good' || b[0] === 'cliff' ? 14 : 0);
    });
    var H = y + pad;

    cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
    ctx.fillStyle = '#101826'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#F2A33C'; ctx.fillRect(0, 0, 8, H);
    ctx.textBaseline = 'top';

    plan.forEach(function (p) {
      ctx.font = fontFor(p.t);
      var x = pad, color = '#E6EDF7';
      if (p.t === 'h') color = '#FFFFFF';
      else if (p.t === 's') color = '#8FA0BA';
      else if (p.t === 'h3') color = '#F2A33C';
      else if (p.t === 'bad') { color = '#F0B9AE'; x = pad + 26; }
      else if (p.t === 'good') { color = '#A8E6CD'; x = pad + 26; }
      else if (p.t === 'cliff') { color = '#FFD479'; x = pad + 26; }
      else if (p.t === 'li') { x = pad + 26; }
      ctx.fillStyle = color;
      p.lines.forEach(function (L, i) {
        if (p.t === 'li' && i === 0) { ctx.fillStyle = '#7BB4FF'; ctx.fillText('•', pad + 6, p.y); ctx.fillStyle = color; }
        if ((p.t === 'bad' || p.t === 'good' || p.t === 'cliff') && i === 0) {
          ctx.fillStyle = p.t === 'bad' ? '#E8624A' : p.t === 'good' ? '#3FBF8F' : '#F2A33C';
          ctx.fillRect(pad + 8, p.y + 4, 4, p.lines.length * p.lh - 8);
          ctx.fillStyle = color;
        }
        ctx.fillText(L, x, p.y + i * p.lh);
      });
    });

    ctx.font = '400 19px ' + FS; ctx.fillStyle = '#5D6E88';
    ctx.textAlign = 'right';
    ctx.fillText('โรงหล่อพอลิเมอร์ ' + S.VERSION, W - pad, H - pad + 12);
    ctx.textAlign = 'left';

    var url = cv.toDataURL('image/png');
    var img = $('#codexImg'); img.src = url; img.style.display = 'block';
    $('#cx-tip').style.display = 'block';
    try {
      var a = document.createElement('a');
      a.href = url; a.download = 'บันทึกวิศวกร.png'; a.click();
    } catch (e) {}
    U.toast('สร้างภาพแล้ว');
    img.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  root.PFLCodex = { render: render, stats: stats, unlocked: unlocked };
})(typeof window !== 'undefined' ? window : globalThis);

/* ============================================================
   82_quiz.js — โหมดแบบทดสอบ HOTs
   สุ่ม 10 ข้อปรนัย + 2 ข้อเขียน · ย้อนกลับไปแก้ข้อเดิมได้
   · ส่งครั้งเดียวเมื่อทำเสร็จ · ออกจากหน้านี้ก่อนส่ง คำตอบทั้งหมดถูกทิ้ง
   หมายเหตุ: ส่วนนี้อยู่นอกวงจร GBL โดยเจตนา

(function (root) {
  'use strict';
  var S = root.PFLState, D = root.PFLData, U = root.PFLUI, A = root.PFLArt;
  var $ = U.$, esc = U.esc;

  var N_MC = 10, N_OPEN = 2;
  var st = null;          // null = ยังไม่ได้เริ่ม หรือส่งไปแล้ว

  function shuffle(a) {
    a = a.slice();
