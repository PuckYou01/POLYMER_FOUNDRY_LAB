  }

  function open() { intro(); U.show('v-quiz'); }

  /* ระบบเส้นทางหน้าจอเรียกใช้เพื่อถามก่อนออก */
  function hasUnsaved() { return !!(st && !st.submitted); }
  function discard() { st = null; }

  function intro() {
    st = null;
    var hist = S.progress.quiz || [], last = hist.length ? hist[hist.length - 1] : null;
    $('#quiz-body').innerHTML =
      A.banner('quiz', 'g') +
      '<div class="brief"><div class="client">โหมดประเมิน</div>' +
      '<p>สุ่ม <b>' + N_MC + ' ข้อปรนัย</b> จากคลัง ' + D.QUIZ.length + ' ข้อ และ <b>' + N_OPEN +
      ' ข้อเขียน</b> ที่ให้เลือกประเด็นก่อนแล้วอธิบายต่อด้วยตนเอง<br>' +
      'ข้ามไปทำข้ออื่นก่อนแล้วย้อนกลับมาแก้ได้ตลอด และจะส่งคำตอบทั้งหมดพร้อมกันครั้งเดียวเมื่อทำเสร็จ</p></div>' +
      (last ? '<div class="card"><h2>ครั้งล่าสุด</h2><p class="muted" style="margin:0">ปรนัยได้ ' +
        last.mc + '/' + N_MC + ' · ทำเมื่อ ' + new Date(last.at).toLocaleDateString('th-TH') + '</p></div>' : '') +
      '<div class="warnbox">ถ้าออกจากหน้านี้ก่อนกดส่ง คำตอบทั้งหมดจะถูกทิ้งและไม่ถูกบันทึก</div>' +
      '<p class="tiny">คำตอบข้อเขียนจะถูกส่งให้ครูตรวจ ระบบไม่ได้ให้คะแนนข้อเขียนโดยอัตโนมัติ ' +
      'แต่จะแสดงประเด็นสำคัญให้เทียบกับคำตอบของตนเองหลังส่ง</p>' +
      '<button class="btn" id="qz-go">เริ่มทำแบบทดสอบ</button>';

  function start() {

    step();

  function answered(it) {
    if (it.t === 'mc') return st.ans[it.q.id] != null;

    var ang = it.q.angles.filter(function (x) { return x.id === a.angle; })[0];
    return (a.text || '').trim().length - (ang ? ang.stem.length : 0) >= 15;
  }

  function nav() {
    var left = st.items.filter(function (x) { return !answered(x); }).length;
    return '<div class="qnav" id="qz-nav">' + st.items.map(function (it, k) {
      return '<button data-i="' + k + '" class="' + (k === st.i ? 'cur ' : '') +
             (answered(it) ? 'ok ' : '') + (it.t === 'open' ? 'wr' : '') + '">' + (k + 1) + '</button>';
    }).join('') + '</div>' +
    '<p class="tiny navnote">' + (left ? 'ยังเหลืออีก ' + left + ' ข้อ' : 'ทำครบทุกข้อแล้ว ส่งคำตอบได้') + '</p>';
  }

  function foot() {
    var left = st.items.filter(function (x) { return !answered(x); }).length;
    return '<div class="qfoot"><button class="btn ghost" id="qz-prev"' + (st.i === 0 ? ' disabled' : '') + '>ข้อก่อนหน้า</button>' +
      '<button class="btn ghost" id="qz-next"' + (st.i >= st.items.length - 1 ? ' disabled' : '') + '>ข้อถัดไป</button></div>' +
      '<button class="btn" id="qz-submit"' + (left ? ' class="btn ghost"' : '') + '>' +

  function wireCommon() {
    $('#qz-nav').querySelectorAll('[data-i]').forEach(function (b) {

    $('#qz-prev').onclick = function () { if (st.i > 0) { st.i--; step(); } };
    $('#qz-next').onclick = function () { if (st.i < st.items.length - 1) { st.i++; step(); } };
    $('#qz-submit').onclick = function () {
      var left = st.items.filter(function (x) { return !answered(x); }).length;
      if (!left) { finish(); return; }
      U.ask({ title:'ยังตอบไม่ครบ', ok:'ส่งเลย', cancel:'กลับไปทำต่อ',
        text:'ยังเหลืออีก ' + left + ' ข้อที่ยังไม่ได้ตอบ ข้อที่ไม่ได้ตอบจะถือว่าไม่ได้คะแนน',

      '<button class="btn" id="qz-home">กลับหน้าหลัก</button></div>';

  root.PFLQuiz = { open: open, hasUnsaved: hasUnsaved, discard: discard };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 84_facts.js ===== */
/* ============================================================
   84_facts.js — เกร็ดความรู้พอลิเมอร์ในชีวิตประจำวัน
   ============================================================ */
(function (root) {
  'use strict';
  var S = root.PFLState, D = root.PFLData, U = root.PFLUI, A = root.PFLArt;
  var $ = U.$, esc = U.esc;

  function open() { list(); U.show('v-facts'); }

  function seen() { return S.progress.factsSeen || (S.progress.factsSeen = {}); }

  /* ถ้ามีรูปจริงฝังไว้ใช้รูปจริง ถ้าไม่มีใช้ภาพวาด SVG แทน
     จึงทยอยเติมรูปจริงทีละเรื่องได้โดยไม่ต้องรอให้ครบ                */
  function art(id, i, alt) {
    var ph = D.FACT_PHOTOS && D.FACT_PHOTOS[id + i];
    if (!ph) return A.cardArt(id, i);
    return '<figure class="photo"><img src="' + ph.s + '" alt="' + esc(alt) + '" loading="lazy" decoding="async">' +
           (ph.c ? '<figcaption>' + esc(ph.c) + '</figcaption>' : '') + '</figure>';
  }

  function list() {
    var sn = seen();
    var total = D.FACTS.reduce(function (s, f) { return s + f.cards.length; }, 0);
    var read = Object.keys(sn).length;
    $('#facts-body').innerHTML =
      A.banner('facts', 'f') +
      '<div class="brief"><div class="client">ห้องสมุดโรงงาน</div>' +
      '<p>เรื่องที่ไม่ได้อยู่ในข้อสอบ แต่ทำให้เห็นว่าเคมีพอลิเมอร์อยู่รอบตัวเราตรงไหนบ้าง</p></div>' +
      '<p class="tiny">อ่านแล้ว ' + read + ' จาก ' + total + ' เรื่อง</p>' +
      D.FACTS.map(function (f) {
        var r = f.cards.filter(function (c, i) { return sn[f.id + i]; }).length;
        return '<button class="mission fact' + (r === f.cards.length ? ' done' : '') + '" data-f="' + f.id + '">' +
          A.factArt(f.id) +
          '<span class="tx"><b>' + esc(f.title) + '</b><i>' + esc(f.sub) + ' · ' + f.cards.length + ' เรื่อง</i></span></button>';
      }).join('');
    $('#facts-body').querySelectorAll('[data-f]').forEach(function (b) {
      b.onclick = function () { cat(b.dataset.f); }; });
  }

  function cat(id) {
    var f = D.FACTS.filter(function (x) { return x.id === id; })[0], sn = seen();
    $('#facts-body').innerHTML =
      A.banner('facts', 'f') +
      '<div class="brief"><div class="client">' + esc(f.sub) + '</div>' +
      '<p style="font-size:17px;font-weight:600">' + esc(f.title) + '</p></div>' +
      f.cards.map(function (c, i) {
        return '<details class="factcard" data-k="' + id + i + '"' + (sn[id + i] ? ' data-read="1"' : '') + '>' +
          '<summary>' + esc(c[0]) + '</summary>' +
          '<div class="factbody">' + art(id, i, c[0]) + '<p>' + esc(c[1]) + '</p></div></details>'; }).join('') +
      '<button class="btn ghost" id="fa-back" style="margin-top:14px">กลับไปเลือกหมวด</button>';

    $('#facts-body').querySelectorAll('.factcard').forEach(function (el) {
      el.addEventListener('toggle', function () {
        if (el.open) { seen()[el.dataset.k] = 1; S.saveProgress(); el.dataset.read = '1'; }
      });
    });
    $('#fa-back').onclick = list;
  }

  root.PFLFacts = { open: open };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 90_boot.js ===== */
/* ============================================================
   90_boot.js — เริ่มทำงาน
   ============================================================ */
(function (root) {
  'use strict';
  var S = root.PFLState, U = root.PFLUI;
  var $ = U.$;

  function boot() {
    document.querySelectorAll('[data-back]').forEach(function (b) {
      b.onclick = function () {
        var from = b.closest('.view');
        var t = b.dataset.back;
        var go = function () { if (t === 'v-home') U.renderHome(); U.show(t); };
        if (from && from.id === 'v-quiz' && root.PFLQuiz.hasUnsaved()) {
          U.ask({ title:'ออกจากแบบทดสอบ', danger:true, ok:'ออกและทิ้งคำตอบ', cancel:'ทำต่อ',
            text:'คำตอบทั้งหมดจะไม่ถูกบันทึกและไม่ถูกส่งให้ครู',
            onOk:function () { root.PFLQuiz.discard(); go(); } });
          return;
        }
        go();
      };
    });

    $('#btn-cfg').onclick = U.renderCfg;

    $('#btn-start').onclick = function () {
      var name = $('#in-name').value.trim();
      if (!name) { U.toast('กรอกชื่อก่อนเข้าโรงงาน'); $('#in-name').focus(); return; }
      S.setProfile({ name: name, room: $('#in-room').value.trim(), no: $('#in-no').value.trim() });
      U.renderHome(); U.show('v-home');
    };

    S.onSync = function (n) {
      var l = $('#sync-l'), v = $('#sync-v');
      if (!l) return;
      if (!S.endpoint) { l.textContent = 'ยังไม่ได้ตั้งปลายทางข้อมูล'; l.className = ''; }
      else if (n > 0) { l.textContent = 'รอส่ง ' + n + ' รายการ'; l.className = 'warn'; }
      else { l.textContent = 'ส่งข้อมูลครบแล้ว'; l.className = ''; }
      v.textContent = S.VERSION;
      var q = $('#cfg-q'); if (q) q.textContent = n;
    };

    if (S.profile && S.profile.name) {
      $('#in-name').value = S.profile.name;
      $('#in-room').value = S.profile.room || '';
      $('#in-no').value = S.profile.no || '';
      U.renderHome(); U.show('v-home');
    }
    S.ping();

    // กันการซูมด้วยการแตะสองครั้งบน iOS รุ่นเก่า
    var last = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - last < 320) e.preventDefault();
      last = now;
    }, { passive: false });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
